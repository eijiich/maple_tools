<script>
/* ==== js/sf.js ==== */
/* ===========================================================================
 * Star force cost engine.
 *
 * The constants and the four solver functions below are VENDORED VERBATIM from
 * lostara's star force calculator (lostara_sf_caculator.html, lines 545-1035 of
 * the copy saved in this folder). They are not reimplemented and should not be
 * "improved" -- lostara is the reference this tool is checked against, so any
 * edit here silently breaks parity.
 *
 * Only two adaptations were made:
 *   - getModeIndex() read a <select> from lostara's DOM. Mode choice here comes
 *     from solveSpares' policy instead, so that function is dropped.
 *   - a memo cache and the stat-gain valuation (which lostara has no need for,
 *     being cost-only) are added at the bottom, clearly separated.
 *
 * Facts about the current system that the code encodes, worth knowing when
 * reading it:
 *   - Failure MAINTAINS the star. Only a boom regresses you, to recoveryStar(s),
 *     which is not always 12. That is why V solves in one backward pass.
 *   - Stars 15-21 have four "enhancement modes" trading cost against boom
 *     chance; mode 4 cannot boom at all. Outside 15-21 there is no choice.
 *   - rawCost uses per-star divisors, not one formula.
 * ======================================================================== */

const STAR_ENHANCE_MIN   = 15;
const STAR_ENHANCE_MAX   = 21;
const STAR_ENHANCE_COUNT = STAR_ENHANCE_MAX - STAR_ENHANCE_MIN + 1; // 7
const STAR_ENHANCE_MODES = 4;
const STAR_MAX           = 30;

// ─── standard rates (mode 1) ──────────────────────────────────────────────────
const RATES = [
  [0.95, 0.05, 0],       // 0
  [0.90, 0.10, 0],       // 1
  [0.85, 0.15, 0],       // 2
  [0.85, 0.15, 0],       // 3
  [0.80, 0.20, 0],       // 4
  [0.75, 0.25, 0],       // 5
  [0.70, 0.30, 0],       // 6
  [0.65, 0.35, 0],       // 7
  [0.60, 0.40, 0],       // 8
  [0.55, 0.45, 0],       // 9
  [0.50, 0.50, 0],       // 10
  [0.45, 0.55, 0],       // 11
  [0.40, 0.60, 0],       // 12
  [0.35, 0.65, 0],       // 13
  [0.30, 0.70, 0],       // 14
  [0.30, 0.679, 0.021],  // 15
  [0.30, 0.679, 0.021],  // 16
  [0.15, 0.782, 0.068],  // 17
  [0.15, 0.782, 0.068],  // 18
  [0.15, 0.765, 0.085],  // 19
  [0.30, 0.595, 0.105],  // 20
  [0.15, 0.7225, 0.1275],// 21
  [0.15, 0.68, 0.17],    // 22
  [0.10, 0.72, 0.18],    // 23
  [0.10, 0.72, 0.18],    // 24
  [0.10, 0.72, 0.18],    // 25
  [0.07, 0.744, 0.186],  // 26
  [0.05, 0.76, 0.19],    // 27
  [0.03, 0.776, 0.194],  // 28
  [0.01, 0.792, 0.198],  // 29
];

// ─── enhancement mode rates ───────────────────────────────────────────────────
// ENHANCE_MODES[star - STAR_ENHANCE_MIN][modeIndex 0-3] = [success, fail, destroy, costMultiplier]
// stars 15-17: success unchanged, destroy reduces. cost ×1/1.5/2.5/3.
// stars 15-16: destroy reduction fractions extrapolated from measured 17→18 data.
// stars 18-21: success also decreases. cost ×1/2/3.5/6.5. (measured)
const ENHANCE_MODES = [
  // star 15
  [[0.30,0.679,0.021,1.0],[0.30,0.68688,0.01313,1.5],[0.30,0.69475,0.00525,2.5],[0.30,0.70,0.0,3.0]],
  // star 16
  [[0.30,0.679,0.021,1.0],[0.30,0.68688,0.01313,1.5],[0.30,0.69475,0.00525,2.5],[0.30,0.70,0.0,3.0]],
  // star 17 (measured)
  [[0.15,0.782,0.068,1.0],[0.15,0.8075,0.0425,1.5],[0.15,0.833,0.017,2.5],[0.15,0.85,0.0,3.0]],
  // star 18 (measured)
  [[0.15,0.782,0.068,1.0],[0.12,0.836,0.044,2.0],[0.10,0.882,0.018,3.5],[0.08,0.92,0.0,6.5]],
  // star 19 (measured)
  [[0.15,0.765,0.085,1.0],[0.12,0.8184,0.0616,2.0],[0.10,0.864,0.036,3.5],[0.08,0.92,0.0,6.5]],
  // star 20 (measured)
  [[0.30,0.595,0.105,1.0],[0.25,0.675,0.075,2.0],[0.20,0.76,0.04,3.5],[0.15,0.85,0.0,6.5]],
  // star 21 (measured)
  [[0.15,0.7225,0.1275,1.0],[0.12,0.792,0.088,2.0],[0.10,0.855,0.045,3.5],[0.08,0.92,0.0,6.5]],
];

// mode cost multiplier labels, by [old-tier 15-17, new-tier 18-21]
const MODE_COST_LABEL = [['×1','×1'], ['×1.5','×2'], ['×2.5','×3.5'], ['×3','×6.5']];

function getRates(s, modeIdx, boomOff, catching = false) {
  let [ps, pf, pd] = (s >= STAR_ENHANCE_MIN && s <= STAR_ENHANCE_MAX)
    ? ENHANCE_MODES[s - STAR_ENHANCE_MIN][modeIdx]
    : RATES[s];
  // 30% boom reduction: remainder goes to fail
  if (boomOff && s <= STAR_ENHANCE_MAX && pd > 0) {
    const reduction = pd * 0.30;
    pd -= reduction;
    pf += reduction;
  }
  if (catching && ps < 1) {
    const psNew = ps * 1.05;
    const scale  = (1 - psNew) / (1 - ps);
    pf = pf * scale;
    pd = pd * scale;
    ps = psNew;
  }
  return [ps, pf, pd];
}

// ─── recovery star (gms) ──────────────────────────────────────────────────────
function recoveryStar(s) {
  if (s <= 19) return 12;
  if (s === 20) return 15;
  if (s <= 22) return 17;
  if (s <= 25) return 19;
  return 20;
}

// ─── cost formula ─────────────────────────────────────────────────────────────
// Returns raw (pre-rounding) base cost
function rawCost(S, L) {
  if (S <= 9)  return 1000 + Math.floor(L**3 * (S+1) / 25);
  if (S === 10) return 1000 + Math.floor(L**3 * 11**2.7 / 400);
  if (S === 11) return 1000 + Math.floor(L**3 * 12**2.7 / 220);
  if (S === 12) return 1000 + Math.floor(L**3 * 13**2.7 / 150);
  if (S === 13) return 1000 + Math.floor(L**3 * 14**2.7 / 110);
  if (S === 14) return 1000 + Math.floor(L**3 * 15**2.7 / 75);
  if (S === 15) return 1000 + Math.floor(L**3 * 16**2.7 / 200);
  if (S === 16) return 1000 + Math.floor(L**3 * 17**2.7 / 200);
  if (S === 17) return 1000 + Math.floor(L**3 * 18**2.7 / 150);
  if (S === 18) return 1000 + Math.floor(L**3 * 19**2.7 / 70);
  if (S === 19) return 1000 + Math.floor(L**3 * 20**2.7 / 45);
  if (S === 20) return 1000 + Math.floor(L**3 * 21**2.7 / 200);
  if (S === 21) return 1000 + Math.floor(L**3 * 22**2.7 / 125);
  return 1000 + Math.floor(L**3 * (S+1)**2.7 / 200);
}

function attemptCost(s, L, mvp, costOff, modeIdx) {
  const raw = rawCost(s, L);
  const mult = (s >= STAR_ENHANCE_MIN && s <= STAR_ENHANCE_MAX) ? ENHANCE_MODES[s - STAR_ENHANCE_MIN][modeIdx][3] : 1.0;
  const mvpFactor = s <= 16 ? (1 - mvp) : 1;
  const totalMult = mult * (costOff ? 0.70 : 1) * mvpFactor;
  return Math.round(raw * totalMult / 100) * 100;
}

// ─── spares optimizer ────────────────────────────────────────────────────────
// V[s][y] = min expected cost to reach `to` from s with y items remaining
function solveSpares(L, mvp, costOff, boomOff, catching, to, maxY, itemCost = 0,
                     recFn = recoveryStar) {
  const V   = Array.from({length: STAR_MAX + 1}, () => new Array(maxY + 1).fill(Infinity));
  const pol = Array.from({length: STAR_MAX + 1}, () => new Uint8Array(maxY + 1));
  for (let y = 0; y <= maxY; y++) V[to][y] = 0;
  for (let y = 1; y <= maxY; y++) {
    for (let s = to - 1; s >= 0; s--) {
      const r = recFn(s);
      const nM = (s >= STAR_ENHANCE_MIN && s <= STAR_ENHANCE_MAX) ? STAR_ENHANCE_MODES : 1;
      let best = Infinity, bestM = 0;
      for (let m = 0; m < nM; m++) {
        const [ps, , pd] = getRates(s, m, boomOff, catching);
        const cost = attemptCost(s, L, mvp, costOff, m);
        const recTerm = pd === 0 ? 0 : pd * (y >= 2 ? (itemCost + V[r][y - 1]) : Infinity);
        const num = cost + ps * V[s + 1][y] + recTerm;
        const val = isFinite(num) ? num / (ps + pd) : Infinity;
        if (val < best) { best = val; bestM = m; }
      }
      V[s][y] = best; pol[s][y] = bestM;
    }
  }
  return { V, pol };
}

// Unconstrained optimal (infinite booms allowed) — process increasing like solve(),
// using cumulative recovery cost already computed for earlier stars.
function solveUnconstrained(L, mvp, costOff, boomOff, catching, to, itemCost = 0,
                            recFn = recoveryStar) {
  const X   = new Array(STAR_MAX + 1).fill(0); // X[s] = optimal expected cost to advance s★→(s+1)★
  const pol = new Array(STAR_MAX + 1).fill(0);
  for (let s = 0; s < to; s++) {
    const r    = recFn(s);
    const cumX = X.slice(Math.min(r, s), s).reduce((a, v) => a + v, 0);
    const nM   = (s >= STAR_ENHANCE_MIN && s <= STAR_ENHANCE_MAX) ? STAR_ENHANCE_MODES : 1;
    let best = Infinity, bestM = 0;
    for (let m = 0; m < nM; m++) {
      const [ps, , pd] = getRates(s, m, boomOff, catching);
      const cost = attemptCost(s, L, mvp, costOff, m);
      const val = pd === 0 ? cost / ps : (cost + pd * (itemCost + cumX)) / ps;
      if (val < best) { best = val; bestM = m; }
    }
    X[s] = best; pol[s] = bestM;
  }
  // V[s] = total expected cost from s★ to to★
  const V = new Array(STAR_MAX + 1).fill(0);
  for (let s = to - 1; s >= 0; s--) V[s] = V[s + 1] + X[s];
  return { V, pol };
}

// ─── variance of the cost, for percentiles ───────────────────────────────────
// Same recursion as solveUnconstrained but also carrying the second moment, so a
// pXX cost can be quoted rather than just the mean. Variance derivation: law of
// total variance on the one-step decomposition. No-boom is geometric,
// Var = c²(1−p)/p²; the boom case adds the variance of re-climbing from recovery.
function solve(L, mvp, costOff, boomOff, catching, modesByStarFn, itemCost = 0,
               recFn = recoveryStar, recoveryFn = null) {
  const X = new Array(STAR_MAX).fill(0);
  const D = new Array(STAR_MAX).fill(0);
  const V = new Array(STAR_MAX).fill(0);
  const DVar = new Array(STAR_MAX).fill(0);
  for (let s = 0; s < STAR_MAX; s++) {
    const m = modesByStarFn(s);
    const [ps, , pd] = getRates(s, m, boomOff, catching);
    const cost = attemptCost(s, L, mvp, costOff, m);
    // What a boom at s costs, in mean / variance / booms / boom-variance. The
    // default is "fall to recFn(s), pay itemCost, climb back", which is every
    // ordinary item. recoveryFn exists because a Destiny is not ordinary: it comes
    // back at 12★ and you may instead BUY your way to 22★, so recovery is a choice
    // between two routes rather than one forced climb. itemCost is deterministic, so
    // it moves the mean and leaves the variance alone.
    const climb = (from) => ({
      x: X.slice(Math.min(from, s), s).reduce((a, v) => a + v, 0),
      v: V.slice(Math.min(from, s), s).reduce((a, v) => a + v, 0),
      d: D.slice(Math.min(from, s), s).reduce((a, v) => a + v, 0),
      dvar: DVar.slice(Math.min(from, s), s).reduce((a, v) => a + v, 0),
    });
    const rec = recoveryFn ? recoveryFn(s, climb) : climb(recFn(s));
    const recV = rec.v, recD = rec.d, recDVar = rec.dvar;
    const recXi = rec.x + (recoveryFn ? 0 : itemCost);
    if (pd === 0) {
      X[s] = cost / ps;
      D[s] = 0;
      V[s] = cost * cost * (1 - ps) / (ps * ps);
      DVar[s] = 0;
    } else {
      X[s] = (cost + pd * recXi) / ps;
      D[s] = pd * (1 + recD) / ps;
      V[s] = (cost*cost + 2*cost*X[s]*(1-ps) - ps*X[s]*X[s]
              + pd*(recXi*recXi + 2*recXi*(cost+X[s]) + recV)) / ps;
      const pf = 1 - ps - pd;
      const K = 1 + recD + D[s];
      const pfMuPdK = pf*D[s] + pd*K;
      DVar[s] = (pf*D[s]*D[s] + pd*recDVar + pd*K*K - pfMuPdK*pfMuPdK) / ps;
    }
  }
  return { X, D, V, DVar };
}

// Rational approximation (Abramowitz & Stegun 26.2.17), max error ~4.5e-4
function normalQuantile(p) {
  if (p <= 0) return -Infinity;
  if (p >= 1) return Infinity;
  const a = [2.515517, 0.802853, 0.010328];
  const b = [1.432788, 0.189269, 0.001308];
  const t = Math.sqrt(-2 * Math.log(p < 0.5 ? p : 1 - p));
  const z = t - (a[0] + t*(a[1] + t*a[2])) / (1 + t*(b[0] + t*(b[1] + t*b[2])));
  return p < 0.5 ? -z : z;
}

/**
 * Cost at a given percentile, fitting a lognormal to the mean and variance.
 *
 * Star force cost has no closed-form distribution once booms are in play, so this
 * is an approximation -- the same one lostara quotes its p85 from. Cubing does not
 * need it: cube count is exactly geometric, so its percentile is exact.
 */
function lognormalPct(mu, variance, pct) {
  if (variance <= 0 || mu <= 0) return mu;
  const cv2 = variance / (mu * mu);
  const sig2 = Math.log(1 + cv2);
  const muLn = Math.log(mu) - sig2 / 2;
  return Math.exp(muLn + normalQuantile(pct / 100) * Math.sqrt(sig2));
}

/**
 * Number of independent attempts needed to succeed at least once with probability
 * `pct`, when each attempt succeeds with probability p. Exact, unlike the star
 * force case: ceil(log(1-pct) / log(1-p)). This is cubing.py's own percentile
 * formula, and it also covers flame rerolls.
 */
function geometricPct(p, pct) {
  if (p <= 0) return Infinity;
  if (p >= 1) return 1;
  const q = Math.min(Math.max(pct / 100, 0), 0.999999);
  return Math.ceil(Math.log(1 - q) / Math.log(1 - p));
}

// ─── expected booms under a fixed mode policy ────────────────────────────────
// Same one-step decomposition as the cost recursion, counting destructions
// instead of meso. Used only to explain a row, never to rank it.
function expectedBooms(L, boomOff, catching, from, to, modeAt,
                       recFn = recoveryStar) {
  const D = new Array(STAR_MAX + 1).fill(0);
  for (let s = 0; s < to; s++) {
    const [ps, , pd] = getRates(s, modeAt(s), boomOff, catching);
    if (pd === 0) { D[s] = 0; continue; }
    const r = recFn(s);
    let recD = 0;
    for (let k = Math.min(r, s); k < s; k++) recD += D[k];
    D[s] = pd * (1 + recD) / ps;
  }
  let total = 0;
  for (let s = from; s < to; s++) total += D[s];
  return total;
}

/* ===========================================================================
 * Everything below is this tool's own code, not vendored.
 * ======================================================================== */

/*
 * Genesis and Destiny are handed over at a fixed 22*, their stars coming from
 * liberation quests rather than from star forcing, so there is nothing to buy.
 * Second-stage Destiny liberation unlocks 22*->25*.
 *
 * A boom up there does NOT just cost a fee. Per the user (namu.wiki's Destiny weapon
 * page; the site 403s to automated fetches, so these are their figures):
 *
 *   - 10b recovers the weapon, but it comes back at 12*, not at 22*.
 *   - From there, 54.2b more buys a guaranteed 22*.
 *   - Or you re-star-force 12*->22* yourself, which is usually worse.
 *
 * So recovery is a CHOICE, and the cheaper of the two routes is what a boom really
 * costs. An earlier version of this assumed the weapon returned at 22* for the 10b
 * alone, which understated a boom by tens of billions.
 */
const WEAPON_KINDS = {
  none:     { label: 'ordinary weapon' },
  fixed22:  { label: 'Genesis / Destiny (fixed 22★)', minStar: 22, noSf: true },
  destiny2: {
    label: 'Destiny, 2nd stage liberation',
    minStar: 22, maxStar: 25,
    reviveCost: 10e9,      // recovers the weapon...
    reviveStar: 12,        // ...but only to 12*
    guaranteeCost: 54.2e9, // 12* -> a guaranteed 22*
    guaranteeStar: 22,
  },
};

/**
 * Cost of recovering from a boom at star `s`, for a weapon with a revive/guarantee
 * rule. `climb(from)` gives the mean/variance/booms of star forcing from `from` up to
 * `s` under the policy already solved for the stars below.
 *
 * Two routes, and the cheaper one in expectation is taken:
 *   climb    revive, then star force all the way back from reviveStar
 *   buy      revive, pay the guarantee to reach guaranteeStar, climb the rest
 *
 * The guarantee is deterministic, so that route contributes no extra booms and no
 * extra variance beyond whatever is left above guaranteeStar.
 */
function weaponRecovery(rule, s, climb) {
  const viaClimb = climb(rule.reviveStar);
  const routes = [{
    ...viaClimb,
    x: rule.reviveCost + viaClimb.x,
    route: 'climb',
  }];
  if (rule.guaranteeCost != null) {
    const rest = climb(rule.guaranteeStar);
    routes.push({
      ...rest,
      x: rule.reviveCost + rule.guaranteeCost + rest.x,
      route: 'buy',
    });
  }
  return routes.reduce((best, r) => (r.x < best.x ? r : best));
}

/*
 * Secondaries are mostly not star forceable at all. The ones that are -- lv130 shields
 * for explorer mages, thieves and warriors -- cap at 20*, which already falls out of
 * the 128-137 bracket. Kanna and Dual Blade are exceptions, deliberately out of scope.
 *
 * An Astra secondary is the case worth modelling: spares are not farmed, they cost 1b
 * each. That is exactly what itemCost means, so a boom here is priced rather than free.
 */
const SECONDARY_KINDS = {
  none:  { label: 'ordinary secondary' },
  astra: { label: 'Astra secondary (spares cost 1b)', itemCost: 1e9 },
};

// Reboot: no MVP discount exists. SSF is assumed always on -- per the user,
// starforcing outside the event is never the right move. Editable in settings.
const SF_DEFAULTS = {
  mvp: 0,
  event: 'ssf',   // 'none' | '30off' | '30boom' | 'ssf'
  catching: true,
  itemCost: 0,    // spares are farmed, so a boom costs only the lost stars
  // Mode per star for 15->16 .. 21->22, as indices 0-3 for modes 1-4. Outside that
  // range there is no choice. This is a POLICY, not a hint: the ranking prices the
  // strategy you picked rather than searching for the cheapest one, which is what
  // lostara does and the only way a "safeguard 15-18" plan can be costed at all.
  modes: [0, 0, 0, 0, 0, 0, 0],
};

// The three strategies people actually run, named the way they are talked about: one
// digit per star from 15->16 to 21->22, grouped 15-18 / 18-20 / 20-22.
const SF_MODE_PRESETS = {
  '111/11/11': [0, 0, 0, 0, 0, 0, 0],
  '444/11/44': [3, 3, 3, 0, 0, 3, 3],
  '444/44/44': [3, 3, 3, 3, 3, 3, 3],
};

/** Mode index in force at star `s`; 0 outside the 15-21 band, where none exists. */
function sfModeIndex(cfg, s) {
  if (s < STAR_ENHANCE_MIN || s > STAR_ENHANCE_MAX) return 0;
  const m = (cfg.modes || [])[s - STAR_ENHANCE_MIN];
  return (m >= 0 && m < STAR_ENHANCE_MODES) ? m : 0;
}

/**
 * Parse a strategy written the way players say it: "444/11/44", or "4441144", or
 * "4-4-4-1-1-4-4". Returns 7 mode indices, or null if it isn't 7 digits of 1-4.
 *
 * A text field rather than seven dropdowns per row, because per-slot strategies are
 * the point and 23 slots x 7 stars of dropdowns is not a table anyone can read.
 */
function sfModesFromText(text) {
  const digits = String(text || '').replace(/[^1-4]/g, '');
  if (digits.length !== STAR_ENHANCE_COUNT) return null;
  if (String(text || '').replace(/[^0-9]/g, '').length !== STAR_ENHANCE_COUNT) return null;
  return digits.split('').map(d => Number(d) - 1);
}

/** How the preset name is spelled out, for display: "444/11/44". */
function sfModesName(modes) {
  const d = (modes || []).map(m => (m || 0) + 1).join('');
  return `${d.slice(0, 3)}/${d.slice(3, 5)}/${d.slice(5, 7)}`;
}

/**
 * Label for one mode at one star: the boom chance you actually face and what the
 * attempt costs. Effective, not raw -- SSF's 30% boom reduction is already in it,
 * so the labels move when the event changes.
 */
function sfModeLabel(s, m, cfg) {
  const { boomOff } = sfEventFlags(cfg.event);
  const [, , pd] = getRates(s, m, boomOff, cfg.catching);
  const mult = ENHANCE_MODES[s - STAR_ENHANCE_MIN][m][3];
  const risk = pd === 0 ? 'no boom' : `${(pd * 100).toFixed(2)}% boom`;
  return `mode ${m + 1} — ${risk} (×${mult})`;
}

function sfEventFlags(event) {
  return {
    costOff: event === '30off' || event === 'ssf',
    boomOff: event === '30boom' || event === 'ssf',
  };
}

/*
 * Three solvers. The ranking uses only the third; the first two are kept as vendored
 * reference and as oracles the self-tests check the policy numbers against.
 *
 *   solveUnconstrained  "cheapest expected meso, booming as often as it takes",
 *                       choosing modes for you. Always finite. No longer the ranking
 *                       path -- once you name a strategy, cost is not a search.
 *
 *   solveSpares         "cheapest policy that GUARANTEES arrival with only y items".
 *                       Above 21★ no zero-destroy mode exists, so a boom is always
 *                       possible and no finite y guarantees anything -- Infinity is
 *                       the correct answer, not a bug. Replaced in the UI by picking
 *                       mode 4 per star, which says the same thing without a column
 *                       that reads "impossible" for every endgame row.
 *
 *   sfPolicy/solve      cost, booms and variance under the modes you chose. This is
 *                       what the ranking prices.
 */
const _sfCache = new Map();

function _cfgKey(cfg) {
  const w = cfg.weaponRule || {};
  return `${cfg.mvp}|${cfg.event}|${cfg.catching}|${cfg.itemCost}|${cfg.recoverTo ?? ''}`
       + `|${(cfg.modes || []).join('')}`
       + `|${w.reviveCost ?? ''}:${w.reviveStar ?? ''}:${w.guaranteeCost ?? ''}:${w.guaranteeStar ?? ''}`;
}

// A liberated Destiny weapon arrives at 22* from quests, not from star forcing, so a
// recovered one comes back at 22 rather than at the generic recovery star. cfg.recoverTo
// carries that; absent, the vendored gms table applies unchanged.
function _recFn(cfg) {
  const r = cfg.recoverTo;
  return (r == null) ? recoveryStar : (() => r);
}

function sfUnconstrained(level, to, cfg) {
  const key = `U|${level}|${to}|${_cfgKey(cfg)}`;
  let hit = _sfCache.get(key);
  if (!hit) {
    const { costOff, boomOff } = sfEventFlags(cfg.event);
    hit = solveUnconstrained(level, cfg.mvp, costOff, boomOff, cfg.catching, to,
                             cfg.itemCost, _recFn(cfg));
    _sfCache.set(key, hit);
  }
  return hit;
}

function sfSafe(level, to, cfg) {
  const key = `S|${level}|${to}|${_cfgKey(cfg)}`;
  let hit = _sfCache.get(key);
  if (!hit) {
    const { costOff, boomOff } = sfEventFlags(cfg.event);
    // maxY = 1: one item, no backups, so any mode that can boom is rejected
    hit = solveSpares(level, cfg.mvp, costOff, boomOff, cfg.catching, to, 1,
                      cfg.itemCost, _recFn(cfg));
    _sfCache.set(key, hit);
  }
  return hit;
}

/**
 * Cost, expected booms and variance for every star under the chosen mode policy.
 *
 * One recursion supplies all three, so the mean and the percentile can never be
 * computed under different assumptions -- which is exactly how the fee went missing
 * from the percentile column before.
 */
function sfPolicy(level, cfg) {
  const key = `P|${level}|${_cfgKey(cfg)}`;
  let hit = _sfCache.get(key);
  if (!hit) {
    const { costOff, boomOff } = sfEventFlags(cfg.event);
    const rule = cfg.weaponRule;
    hit = solve(level, cfg.mvp, costOff, boomOff, cfg.catching,
                (s) => sfModeIndex(cfg, s), cfg.itemCost, _recFn(cfg),
                rule && rule.reviveCost != null
                  ? (s, climb) => weaponRecovery(rule, s, climb)
                  : null);
    _sfCache.set(key, hit);
  }
  return hit;
}

function sfCacheClear() { _sfCache.clear(); }

/**
 * Expected meso to climb `from` -> `to` under the configured mode policy, plus the
 * modes used and the expected booms.
 *
 * Prices the strategy you chose rather than searching for the cheapest -- picking the
 * modes is the whole point of the panel. Always finite: mode 4 cannot boom below 22*,
 * and above 21* there is no mode choice to make.
 *
 * `solveUnconstrained` and `solveSpares` are no longer on this path. They stay because
 * they are vendored reference and the self-tests check the policy numbers against
 * them, but a chosen policy is not an optimisation problem.
 */
function sfClimb(level, from, to, cfg) {
  if (to <= from) return { cost: 0, modes: [], booms: 0, variance: 0 };

  const { X, D, V, DVar } = sfPolicy(level, cfg);
  let cost = 0, booms = 0, variance = 0, boomVariance = 0;
  for (let s = from; s < to; s++) {
    cost += X[s]; booms += D[s]; variance += V[s]; boomVariance += DVar[s];
  }

  const modes = [];
  for (let s = from; s < to; s++) {
    if (s >= STAR_ENHANCE_MIN && s <= STAR_ENHANCE_MAX) {
      modes.push({ star: s, mode: sfModeIndex(cfg, s) + 1 });
    }
  }

  // Which recovery route a boom at the starting star takes, and what it costs. For a
  // Destiny this is most of the bill, so it belongs on the row rather than buried.
  let recovery = null;
  const rule = cfg.weaponRule;
  if (rule && rule.reviveCost != null) {
    const { X } = sfPolicy(level, cfg);
    const sum = (a, b) => X.slice(a, b).reduce((acc, v) => acc + v, 0);
    const climb = rule.reviveCost + sum(rule.reviveStar, from);
    const buy = rule.reviveCost + rule.guaranteeCost + sum(rule.guaranteeStar, from);
    // `per` is the full cost of one recovery, which is what decides the route. `fee`
    // is only the meso handed over -- the revive, plus the guarantee if bought. The
    // re-climb part of `per` is star force spend that the totals already contain, so
    // attributing it again would report a component larger than the whole.
    recovery = buy < climb
      ? { route: 'buy', per: buy, fee: rule.reviveCost + rule.guaranteeCost }
      : { route: 'climb', per: climb, fee: rule.reviveCost };
  }
  return { cost, modes, booms, variance, boomVariance, recovery };
}

/** Cost to reach `to` at the given percentile; falsy pct gives the mean. */
function sfClimbAtPct(r, pct) {
  if (!pct || !isFinite(r.cost)) return r.cost;
  return lognormalPct(r.cost, r.variance, pct);
}

/**
 * Booms at a given percentile. The mean is what you expect over many climbs; this is
 * what a bad one looks like, and it is the figure that belongs beside a pXX cost.
 *
 * Exactly lostara's line 1312: a lognormal fitted to the mean and variance, the same
 * family it uses for cost, reported CONTINUOUSLY. An earlier version fitted a negative
 * binomial and returned an integer instead, which is a discrete quantile -- i.e. the
 * ceiling of this -- so 22★→23★ read 4 where lostara says 3.26. The discrete figure was
 * arguably the better statistic (booms are counts, and it can return the honest 0 for a
 * short climb) but this file exists to agree with lostara, and "3.26" also carries
 * "about three, maybe four" in a way a hard 4 does not.
 */
function sfBoomsAtPct(r, pct) {
  if (!pct || !isFinite(r.booms)) return r.booms;
  return lognormalPct(r.booms, r.boomVariance || 0, pct);
}

/**
 * Which stat table a slot reads. 'gloves' uses the armor table but also picks up
 * the gloves-only attack lines. Secondaries use the ARMOR table: a lv200 secondary at
 * 20* has cumulative +115 stat and +70 attack, which is the armor table exactly. The
 * weapon table happens to give the same 115 stat, so it is the flat 70 attack that
 * settles it -- weapons compute attack as a formula over their own base instead.
 */
function sfTableFor(kind) {
  if (kind === 'weapon')    return SF_STATS_WEAPON;
  return SF_STATS_ARMOR;
}

/** True when the slot's stat table has no numbers in it yet. */
/**
 * No stat table for this kind. Nothing hits this now that secondaries are known to use
 * the armor table, but it stays as the honest answer for any kind added without data --
 * better a row saying "no table" than one silently valuing stars at zero.
 */
function sfTableEmpty(kind) {
  return !sfTableFor(kind);
}

/** Star cap for a slot, from the wiki-derived tables in sf-stats.js. */
function sfCap(level, kind) {
  const b = sfBracket(level);
  if (b < 0) return 0;
  const caps = kind === 'weapon' ? SF_CAP_WEAPON : SF_CAP_ARMOR;
  return caps[b];
}

/**
 * Main-stat-equivalent value of the stat granted by reaching `star`.
 *
 * The wiki's Delta row for star N is what landing N adds, so a step s -> s+1
 * grants row s+1.
 *
 * `w` is the weight set from value.js. Note stat applies to EACH class-relevant
 * stat, hence w.statPerPoint (= w_main + w_sub) rather than w_main alone.
 * Weapon attack below 16★ is floor(base * mul + add) over the weapon's own base
 * attack, so `baseAtt` is required to value those steps.
 */
function sfStatValue(star, level, kind, w, baseAtt = 0) {
  const b = sfBracket(level);
  if (b < 0) return 0;
  const row = sfTableFor(kind)[star];
  if (!row) return 0;

  const at = (arr) => {
    if (!arr) return 0;
    const v = arr[Math.min(b, arr.length - 1)];
    if (typeof v === 'object' && v) return Math.floor(baseAtt * v.mul + v.add);
    return v || 0;
  };

  let total = at(row.stat) * w.statPerPoint;
  total += at(row.att) * w.att + at(row.matt) * w.matt;
  if (kind === 'gloves') {
    total += at(row.glovesAtt) * w.att + at(row.glovesMatt) * w.matt;
  }
  return total;
}

/** Cumulative stat value of a whole climb from -> to. */
function sfClimbStatValue(from, to, level, kind, w, baseAtt = 0) {
  let total = 0;
  for (let s = from + 1; s <= to; s++) total += sfStatValue(s, level, kind, w, baseAtt);
  return total;
}
</script>

/* ==== js/cubing.js ==== */
/* ===========================================================================

 *
 * The line pools, prime probabilities and cube costs below are a direct port of
 * ../backend/maple_cubing/cubing.py, which is the source of truth. cubeProb()
 * reproduces its calc_prob() exactly and is checked against it by
 * tools/verify_cubing.py.
 *
 * What the model is: an already-legendary 3-line item being rerolled. Line 1 is
 * always a prime (legendary-tier) roll; lines 2 and 3 are prime with probability
 * prime_prob[1] / prime_prob[2] and otherwise roll from the unique pool. Every
 * line that isn't one of the listed desirable outcomes collapses into "Zero".
 *
 * Tier-ups are deliberately not modelled -- at the point you need this tool,
 * getting an item to legendary is not the expensive part.
 * ======================================================================== */

// [nameOfLine, valuePercent, probability] per tier pool.
// Fractions kept as division so they stay checkable against cubing.py.
//
// ONE DELIBERATE DIVERGENCE FROM cubing.py -- see hat.unique below.
const CUBE_POOLS = {

    // shape with 37/52. The stray 41 matches gloves.unique's 41/56, so it looks
    // like a copy-paste slip in cubing.py rather than real data.
    // Corrected here. tools/verify_cubing.py checks parity against the raw
    // value and asserts every pool sums to 1 after the fix.
    unique: [['main_stats',9,5/52],['all_stats',6,4/52],['HP',9,6/52],['Zero',0,37/52]],
    leg:    [['main_stats',12,4/41],['all_stats',9,3/41],['HP',12,4/41],['CD',-2,2/41],['CD',-1,3/41],['Zero',0,25/41]],
  },
  top: {
    unique: [['main_stats',9,5/62],['all_stats',6,4/62],['HP',9,6/62],['Zero',0,47/62]],
    leg:    [['main_stats',12,4/39],['all_stats',9,3/39],['HP',12,4/39],['Zero',0,28/39]],
  },
  bottom: {

const CUBE_PRIME_PROB = { black: [1.0, 0.2, 0.05], red: [1.0, 0.1, 0.01] };
const CUBE_COST       = { black: 22000000, red: 12000000 };

/*
 * Revealing the potential is charged on top of the cube, once per use.
 *
 * Source: MathBro's cubing calculator, cubes_CDdL.js -- getRevealCostConstant()
 * and cubingCost(). The fee is `constant * itemLevel^2`, with the constant
 * stepping 0 / 0.5 / 2.5 / 20 at levels 30 / 70 / 120. Every level this tool
 * handles is past 120, so the constant is always 20:
 *
 *   lv140  392k     lv200    800k
 *   lv150  450k     lv250  1,250k
 *
 * Small beside a 22m black cube, but 2-6% on top of it and proportionally twice
 * that on a 12m red -- so it slightly narrows red's advantage without reversing
 * it. cubing.py omits this entirely, which is why our cube costs were low.
 */
function cubeRevealCost(itemLevel) {
  if (!itemLevel || itemLevel < 30) return 0;
  const k = itemLevel <= 70 ? 0.5 : itemLevel <= 120 ? 2.5 : 20;
  return k * itemLevel ** 2;
}

/*
 * Cube sales knock a fixed percentage off the cube itself.
 *
 * Applied to the cube price only, NOT to the reveal fee -- they are two separate
 * charges and the sale is on the cube. If a sale ever discounts the reveal too, this
 * is the one line to change.
 */
const CUBE_SALE_OFF = 0.25;

/** What one cube actually costs to use on an item of this level. */
function cubeCostPerUse(cubeType, itemLevel, sale = false) {
  const cube = CUBE_COST[cubeType] * (sale ? 1 - CUBE_SALE_OFF : 1);
  return cube + cubeRevealCost(itemLevel);
}

/*
 * Item level 151+ line values (GMS only).
 *
 * Source: StrategyWiki's Potential System page, saved under reference/. Every
 * numeric percentage line gains exactly +1 point at "(GMS) 151+" -- so a
 * legendary main-stat line is 12% below the threshold and 13% at or above it,
 * and a unique one goes 9% -> 10%. The same holds for ATT% and All Stat%.
 *
 * Lines that do NOT move are the ones whose value is baked into the line name
 * rather than being a scaling number: "Ignore 30/35/40% of Monster's DEF",
 * "Damage to Boss Monsters +30/35/40%", the cooldown lines, and MaxHP% at the
 * unique and legendary tiers. Verified line by line against the wiki, not
 * assumed from the pattern.
 *
 * In practice this is the 160+ rule: no equipment exists between 151 and 159, so
 * of the real item levels (140, 150, 160, 200, 250) the bump applies to 160 and
 * up. The constant is written as 151 only because that is how the wiki words it.
 *
 * cubing.py has no notion of item level, so it always uses the lower values.
 * Passing level 0 reproduces it exactly, which is how parity is kept.
 */
const CUBE_LEVEL_BUMP_AT = 151;
const CUBE_LEVEL_BUMP = { main_stats: 1, all_stats: 1, ATT: 1,
  'STR%': 1, 'DEX%': 1, 'INT%': 1, 'LUK%': 1 };

/** A line's value at a given item level. */
function cubeLineValue(name, value, itemLevel) {
  if (!itemLevel || itemLevel < CUBE_LEVEL_BUMP_AT) return value;
  return value + (CUBE_LEVEL_BUMP[name] || 0);
}

const CUBE_CATEGORIES = Object.keys(CUBE_POOLS);

/*
 * Sub-stat % lines for multi-stat classes.
 *
 * The pools track one 'main_stats' line; the other three single-stat % lines sit
 * inside Zero. All four have the SAME probability within a tier (MathBro's rate
 * tables: 5/52 each at unique, 4/41 each at legendary on a hat), so a class that
 * actually values them can lift them out of Zero without touching anything else.
 *
 * Which stats qualify comes from the weights: pct weight >= 25% of the main
 * stat's. That keeps a mage's LUK% folded away (1.64 vs 12.21 = 13%, explicitly
 * called insignificant) and a Shadower's DEX%/STR% too -- their BASES are small,
 * so the % lines are near-worthless for potentials even though the flat stats
 * matter for flames. Xenon's three near-equal stats all qualify.
 */
const CUBE_SUB_MIN_RATIO = 0.25;

function cubeSubStats(w) {
  if (!w || !w.pctByStat) return [];
  return STAT_NAMES.filter(s =>
    s !== w.mainStat && (w.pctByStat[s] || 0) > 0
    && (w.pctByStat[s] || 0) >= CUBE_SUB_MIN_RATIO * (w.mainPct || 0));
}

/** Lift qualifying sub-stat lines out of a pool's Zero mass. */
function cubeExpandPool(entries, subs) {
  if (!subs.length) return entries;
  const main = entries.find(e => e[0] === 'main_stats');
  if (!main) return entries;   // WSE pools have no stat lines at all
  const [, value, prob] = main;
  const out = entries.map(([n, v, pr]) =>
    n === 'Zero' ? [n, v, pr - prob * subs.length] : [n, v, pr]);
  for (const s of subs) out.push([s + '%', value, prob]);
  return out;
}

/*
 * The main/all-stat one-currency collapse exists for one reason: when all-stat is
 * worth MORE per point than main%, scoring the gap lets a roll with fewer total
 * percent outscore one with more (27% all-stat beating 30% main), and fills the
 * ladder with lateral 30%->30% rerolls. Collapsing both to the main% weight kills
 * that inversion.
 *
 * So it applies exactly where the inversion is possible, and is bounded on both
 * sides:
 *   all-stat BELOW main%  -- no inversion possible, the natural ordering is
 *                            already right. Keep the true, lower weight; a Demon
 *                            Avenger sits here (0.561 vs 0.748) and collapsing
 *                            would overvalue its all-stat lines by a third.
 *   within 1.6x above     -- collapse. Every single-stat class (mage 13.84 vs
 *                            12.21, Shadower 13.5 vs 11.9).
 *   beyond 1.6x above     -- do not collapse. Xenon runs on three stats so values
 *                            All Stat% at roughly triple a single stat%, and
 *                            collapsing would price its best line at a third.
 *
 * Every comparison here is a ratio, so this holds for either MapleScouter format.
 */
const CUBE_ALLSTAT_COLLAPSE_MAX = 1.6;

function cubeAllStatWeight(w) {
  const main = w.mainPct || 0, all = w.allStatPct || 0;
  if (!main) return all;
  const collapse = all >= main && all <= CUBE_ALLSTAT_COLLAPSE_MAX * main;
  return collapse ? main : all;
}

/** True when main% and all-stat% are being treated as one currency. */
function cubeStatCollapsed(w) {
  return !w || cubeAllStatWeight(w) === (w.mainPct || 0);
}

/**
 * Every pool is a probability distribution and must sum to 1. A pool that
 * doesn't makes P(target) silently wrong in a direction that is very hard to
 * notice by eye, which is exactly how cubing.py's hat typo survived. Checked at
 * load so an edit to the tables above can't reintroduce it quietly.
 */
const CUBE_POOL_ERRORS = (() => {
  const errs = [];
  for (const cat of CUBE_CATEGORIES) {
    for (const tier of ['unique', 'leg']) {
      const sum = CUBE_POOLS[cat][tier].reduce((a, [, , p]) => a + p, 0);
      if (Math.abs(sum - 1) > 1e-9) {
        errs.push(`${cat}.${tier} sums to ${sum.toFixed(6)}, not 1`);
      }
    }
  }
  if (errs.length) console.error('cubing.js pool tables are broken:\n  ' + errs.join('\n  '));
  return errs;
})();

/** Slot-name -> pool category, matching cubing.py's `equip` argument. */
const SLOT_TO_CUBE_CATEGORY = {
  hat: 'hat', top: 'top', bottom: 'bottom', gloves: 'gloves', shoes: 'shoes',
  cape: 'cape_belt_shoulder', belt: 'cape_belt_shoulder', shoulder: 'cape_belt_shoulder',
  face: 'acc', eye: 'acc', ear: 'acc',
  pend1: 'acc', pend2: 'acc',
  ring1: 'acc', ring2: 'acc', ring3: 'acc', ring4: 'acc',
  heart: 'heart', weapon: 'weapon', secondary: 'secondary',
  emblem: 'emblem', pocket: 'acc',
};

/**
 * The three per-line distributions for a legendary item.
 * Line 1 is always prime; lines 2/3 mix prime and unique by prime_prob.
 */
function cubeLineDists(cubeType, category, itemLevel = 0, subs = []) {
  const pool = CUBE_POOLS[category];
  const leg = cubeExpandPool(pool.leg, subs);
  const unique = cubeExpandPool(pool.unique, subs);
  const p = CUBE_PRIME_PROB[cubeType];
  const lv = (n, v) => cubeLineValue(n, v, itemLevel);
  const mix = (primeP) => [
    ...leg.map(([n, v, pr]) => [n, lv(n, v), pr * primeP]),
    ...unique.map(([n, v, pr]) => [n, lv(n, v), pr * (1 - primeP)]),
  ];
  return [leg.map(([n, v, pr]) => [n, lv(n, v), pr]), mix(p[1]), mix(p[2])];
}

/**
 * Every reachable 3-line outcome, as { prob, sums } where sums maps a line name
 * to its summed value across the three lines.
 *
 * Note IED and BOSS are summed arithmetically here, matching cubing.py. In game
 * IED stacks multiplicatively, so a double-IED roll is slightly overvalued; see
 * the note in cubeValue().
 */
const _comboCache = new Map();

function cubeCombos(cubeType, category, itemLevel = 0, subs = []) {
  // 3876-ish combos per call and the scan asks for them repeatedly; the set only
  // depends on these three inputs, so memoise it.
  const key = `${cubeType}|${category}|${itemLevel >= CUBE_LEVEL_BUMP_AT ? 'hi' : 'lo'}|${subs.join('.')}`;
  const hit = _comboCache.get(key);
  if (hit) return hit;

  const [d1, d2, d3] = cubeLineDists(cubeType, category, itemLevel, subs);
  const out = [];
  for (const [n1, v1, p1] of d1) {
    for (const [n2, v2, p2] of d2) {
      for (const [n3, v3, p3] of d3) {
        const sums = {};
        sums[n1] = (sums[n1] || 0) + v1;
        sums[n2] = (sums[n2] || 0) + v2;
        sums[n3] = (sums[n3] || 0) + v3;
        out.push({ prob: p1 * p2 * p3, sums });
      }
    }
  }
  _comboCache.set(key, out);
  return out;
}

function cubeCacheClear() { _comboCache.clear(); }

/**
 * cubing.py's check_sums: a desired key matches every line name containing it as
 * a substring, and their values are summed. So desiring "stats" requires
 * main_stats + all_stats together, which is the intended behaviour.
 * Positive targets are minimums; negative ones (cooldown) are maximums.
 */
function cubeCheckSums(sums, desired) {
  for (const key in desired) {
    const want = desired[key];
    let got = 0;
    for (const name in sums) {
      if (name.toLowerCase().includes(key.toLowerCase())) got += sums[name];
    }
    if (want >= 0 ? got < want : got > want) return false;
  }
  return true;
}

/** Port of cubing.py calc_prob(). Probability one cube satisfies `desired`. */
function cubeProb(cubeType, category, desired, itemLevel = 0) {
  if (!desired || !Object.keys(desired).length) return 0;
  let total = 0;
  for (const c of cubeCombos(cubeType, category, itemLevel)) {
    if (cubeCheckSums(c.sums, desired)) total += c.prob;
  }
  return total;
}

/* ===========================================================================
 * Valuation and target scanning -- this tool's own additions.
 * ======================================================================== */

/**
 * Main-stat-equivalent value of a rolled line set.
 *
 * `w` comes from value.js. Line values are percentages, so each is multiplied by
 * the matching per-1% weight.
 *
 * Caveat kept deliberately simple: IED is treated as linear in the line's stated
 * percentage. Real IED stacks as 1-(1-a)(1-b), so an item carrying two IED lines
 * is somewhat overvalued. MapleScouter's weight is a derivative at your current
 * IED, which is exactly right for one added line and optimistic for two.
 */
/*
 * Main-stat% and all-stat% are scored as the same currency.
 *
 * All-stat also lifts the secondary stat, so strictly it is worth a bit more per
 * point -- 13.84 against 12.21 on the sample weights. But scoring that gap makes
 * the target scan treat 13+10+7 and 10+10+10 as *different* goals even though both
 * are plainly "30% stat", so the ladder fills with lateral rerolls: three separate
 * rows at 383, 394 and 399 all captioned "stat 30", offering to spend 8-12b
 * turning 30% into a differently-composed 30%.
 *
 * Per the user the secondary-stat contribution is not significant enough to be
 * worth that noise, so any composition summing to the same percentage now scores
 * identically. The practical effect is that the value lattice becomes multiples of
 * the main-stat weight, "30% is 30%", and an item already at 30% correctly sees no
 * 30% target offered.
 *
 * Flames are untouched and keep the distinct all-stat weight -- there is no
 * main-stat% flame line, so nothing is being conflated there.
 */
function cubeValue(sums, w) {
  let total = 0;
  for (const name in sums) {
    const v = sums[name];
    if (!v) continue;
    switch (name) {
      case 'main_stats': total += v * w.mainPct;   break;
      case 'all_stats':  total += v * cubeAllStatWeight(w); break;
      case 'ATT':        total += v * w.attPct;    break;
      case 'BOSS':       total += v * w.boss;      break;
      case 'IED':        total += v * w.ied;       break;
      case 'Crit DMG':   total += v * w.critDmg;   break;
      case 'HP':         total += v * w.hpPct;     break;
      // CD, Drop, Meso and Zero carry no combat value here
      default:
        // injected sub-stat % lines ('DEX%' and friends) for multi-stat classes
        if (name.endsWith('%') && w.pctByStat) {
          total += v * (w.pctByStat[name.slice(0, -1)] || 0);
        }
    }
  }
  return total;
}

/**
 * Rank the worthwhile cube targets for one slot.
 *
 * Rather than asking for thresholds, this scans the achievable value
 * distribution: for every distinct reachable total value V, "reroll until the
 * item is worth at least V" is a candidate target, priced at cubeCost / P(>= V)
 * with the gain being E[value | >= V] minus what the item is worth now.
 *
 * Returns the best `limit` candidates by meso-per-stat. Absolute gain is
 * returned alongside because the cheapest-per-point target is often a trivially
 * small improvement.
 */
function cubeTargetScan(cubeType, category, w, currentValue, limit = 5,
                        constraints = null, itemLevel = 0, sale = false) {
  let combos = cubeCombos(cubeType, category, itemLevel, cubeSubStats(w));

  // A constraint is a line you insist on, not a line you value. Cooldown is the
  // motivating case: there is no seconds-to-main-stat exchange rate, so it cannot
  // be scored -- but demanding -2s pins one of the three lines and removes the
  // chance of rolling three stat lines. Filtering here makes every probability
  // below a joint one, so the price of "-2s AND this much stat" comes out right
  // and can be compared against the unconstrained rows by eye.
  // Uses cubing.py's own semantics: a negative target is a maximum, so cd:-2
  // means the summed cooldown must be at most -2.
  if (constraints && Object.keys(constraints).length) {
    combos = combos.filter(c => cubeCheckSums(c.sums, constraints));
    if (!combos.length) return [];
  }
  // Round when grouping: two different line sets can land on the same value but
  // differ in the 13th decimal, which would otherwise split one threshold into
  // several near-duplicate rows.
  const scored = combos.map(c => ({
    prob: c.prob,
    value: Math.round(cubeValue(c.sums, w) * 1e4) / 1e4,
    sums: c.sums,
  }));
  scored.sort((a, b) => b.value - a.value);

  const cost = cubeCostPerUse(cubeType, itemLevel, sale);
  const out = [];
  let cumProb = 0, cumWeighted = 0, i = 0;

  while (i < scored.length) {
    const v = scored[i].value;
    // absorb every combo with this exact value so thresholds are distinct
    while (i < scored.length && scored[i].value === v) {
      cumProb += scored[i].prob;
      cumWeighted += scored[i].prob * scored[i].value;
      i++;
    }
    if (v <= currentValue || cumProb <= 0) continue;

    const expected = cumWeighted / cumProb;
    const gain = expected - currentValue;
    if (gain <= 0) continue;

    out.push({
      threshold: v,
      prob: cumProb,
      cubes: 1 / cumProb,
      cost: cost / cumProb,
      costPerCube: cost,
      expectedValue: expected,
      gain,
      per: (cost / cumProb) / gain,
      example: scored[i - 1].sums,
    });
  }

  return cubeParetoLadder(out, limit);
}

/**
 * Reduce candidates to the Pareto frontier of (cheap per point, large absolute
 * gain), then take the best `limit`.
 *
 * Sorting by per and requiring each survivor to beat the best gain so far drops
 * anything that is both pricier per point AND smaller, which is never the right
 * call. What's left reads as a ladder: the first entry is the cheapest per point,
 * each next one buys strictly more stat at a worse rate.
 */
function cubeParetoLadder(rows, limit = 5) {
  const sorted = rows.slice().sort((a, b) => a.per - b.per);
  const frontier = [];
  let bestGain = 0;
  for (const c of sorted) {
    if (c.gain > bestGain) { frontier.push(c); bestGain = c.gain; }
  }
  return frontier.slice(0, limit);
}

/** The cube types cubing.py prices. Adding one needs its prime odds and cost. */
const CUBE_TYPES = Object.keys(CUBE_COST);

/**
 * Scan every cube type and return one merged ladder, each rung tagged with the
 * cube that achieves it.
 *
 * Which cube wins is not a fixed property of the slot: red costs 12m against
 * black's 22m but has far worse prime odds (0.1/0.01 versus 0.2/0.05), so red
 * tends to win for easy targets and black for hard ones. Presenting both and
 * letting the frontier decide is strictly more useful than making it a setting.
 *
 * Re-filtering after the merge matters -- two individually-Pareto ladders will
 * contain entries that dominate each other once combined.
 */
/*
 * Memo for the whole scan, not just the combo enumeration.
 *
 * The combo cache below made enumeration free, but the SCAN on top of it -- valuing
 * every combo, grouping by threshold, running Pareto -- was re-run for all 21 cubeable
 * slots on every render. One keystroke in a star field therefore paid for rescanning
 * every other slot's cubing, which is where the sluggishness came from.
 *
 * Keyed on everything the result depends on except the weights, which change far less
 * often and are handled by clearing the whole cache (cubeScanCacheClear).
 */
const _scanCache = new Map();

function cubeScanCacheClear() { _scanCache.clear(); }

function cubeTargetScanAll(category, w, currentValue, limit = 5,
                           constraints = null, itemLevel = 0, sale = false) {
  const key = `${category}|${currentValue}|${limit}|${itemLevel}|${sale ? 1 : 0}`
            + `|${constraints ? JSON.stringify(constraints) : ''}`;
  const memo = _scanCache.get(key);
  if (memo) return memo;

  let all = [];
  for (const ct of CUBE_TYPES) {
    for (const row of cubeTargetScan(ct, category, w, currentValue,
                                     Infinity, constraints, itemLevel, sale)) {
      all.push(Object.assign({ cubeType: ct }, row));
    }
  }
  const out = cubeParetoLadder(all, limit);
  _scanCache.set(key, out);
  return out;
}

/**
 * Readable summary of a rolled line set: "stat 30, IED 30" rather than
 * "all_stats 10, main_stats 20, IED 30".
 *
 * main_stats and all_stats both raise main stat, so their percentages are added --
 * consistent with cubeValue(), which scores them at the same weight. Non-stat lines
 * keep the dropdown's grouping order.
 */
function cubeExampleText(sums, w = null) {
  if (!sums) return '';
  // merge main+all into one 'stat' figure only while they are one currency;
  // for a Xenon they are not, and folding them would hide the distinction
  const collapsed = cubeStatCollapsed(w);
  let statTotal = 0;
  const rest = [];
  for (const name in sums) {
    const v = sums[name];
    if (!v || name === 'Zero') continue;
    if (name === 'main_stats' || (name === 'all_stats' && collapsed)) statTotal += v;
    else rest.push([name, v]);
  }
  const rank = (n) => {
    const i = CUBE_LINE_ORDER.indexOf(n);
    return i === -1 ? CUBE_LINE_ORDER.length : i;
  };
  rest.sort((a, b) => rank(a[0]) - rank(b[0]));

  const parts = rest.map(([n, v]) => `${n === 'all_stats' ? 'all' : n} ${v}`);
  if (statTotal) parts.unshift(`stat ${statTotal}`);
  return parts.join(', ');
}

/**
 * Cubes needed at a given percentile, and what they cost.
 *
 * Exact, unlike the star force equivalent: cube count is geometric, so this is
 * `ceil(log(1-pct) / log(1-p))` -- the same formula cubing.py uses for its own
 * percentile table. A falsy pct gives the mean instead.
 */
function cubeAtPct(t, pct) {
  if (!pct) return { cubes: t.cubes, cost: t.cost };
  const cubes = geometricPct(t.prob, pct);
  return { cubes, cost: cubes * t.costPerCube };
}

/** Value of the lines an item currently has. `lines` is [[name, value], ...]. */
function cubeCurrentValue(lines, w, itemLevel = 0) {
  const sums = {};
  for (const [name, value] of lines) {
    if (!name || name === 'Zero') continue;
    // Stored lines already hold the level-adjusted value the dropdown offered, so
    // itemLevel is only used to re-clamp a value saved before the level changed.
    sums[name] = (sums[name] || 0) + Number(value || 0);
  }
  return cubeValue(sums, w);
}

// Display order for the line dropdowns: offensive lines first, then the
// situational ones. Anything unlisted sorts last.
// Per-category overrides for the order lines are OFFERED in. Only gloves need one: they
// are the only slot rolling Crit DMG, and it beats the stat lines there.
const CUBE_LINE_ORDER_BY_CATEGORY = {
  gloves: ['Crit DMG', 'main_stats', 'all_stats', 'STR%', 'DEX%', 'INT%', 'LUK%',
           'ATT', 'BOSS', 'IED', 'CD', 'HP', 'Drop', 'Meso'],
};

const CUBE_LINE_ORDER = [
  'main_stats', 'all_stats', 'STR%', 'DEX%', 'INT%', 'LUK%', 'ATT', 'BOSS', 'IED',
  'Crit DMG', 'CD', 'HP', 'Drop', 'Meso',
];

/**
 * Distinct [name, value] line options for a slot, grouped by line type and
 * ordered strongest-first inside each group. Values are level-adjusted, so a
 * 160+ item offers 13% where a 150 item offers 12%.
 */
function cubeLineOptions(category, itemLevel = 0, subs = [], legendaryOnly = false) {
  const pool = CUBE_POOLS[category];
  const seen = new Set();
  const out = [];
  // Line 1 is prime for both cube types -- CUBE_PRIME_PROB[*][0] is 1.0, and
  // cubeLineDists builds slot 1 from `leg` alone with no unique mixed in. So offering
  // unique-tier values there lets you describe an item the engine treats as
  // impossible: a 9% main stat cannot be line 1, only 12% can.
  const pools = legendaryOnly ? [cubeExpandPool(pool.leg, subs)]
                              : [cubeExpandPool(pool.leg, subs),
                                 cubeExpandPool(pool.unique, subs)];
  for (const [name, rawValue] of pools.flat()) {
    const value = cubeLineValue(name, rawValue, itemLevel);
    const key = name + '|' + value;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push([name, value]);
  }
  // Gloves are the one category where Crit DMG is the line you actually want, so it
  // leads the list there rather than sitting under the stat lines. Ordering only -- the
  // pool, the odds and the scoring are untouched; this is about which option your eye
  // lands on first when filling the row in.
  const order = CUBE_LINE_ORDER_BY_CATEGORY[category] || CUBE_LINE_ORDER;
  const rank = (n) => {
    const i = order.indexOf(n);
    return i === -1 ? order.length : i;
  };
  out.sort((a, b) => {
    if (rank(a[0]) !== rank(b[0])) return rank(a[0]) - rank(b[0]);
    // CD is stored negative, so "bigger reduction" means more negative
    return a[0] === 'CD' ? a[1] - b[1] : b[1] - a[1];
  });
  return out;
}

<script>
/* ==== js/value.js ==== */
/* ===========================================================================
 * Turning MapleScouter output into weights the two engines can use.
 *
 * MapleScouter's table is three columns wide: a row label, an editable AMOUNT, and
 * the value of that amount. The value column is a dropdown -- "Main Stat" gives it
 * in main-stat-equivalent, "Final Damage" gives it as a % of final damage with a %
 * suffix on every row. Both are the same weight set in different units, so either
 * ranks identically; only the printed scale differs, since everything downstream is
 * a ratio of cost to value. `unit` records which arrived so columns can be labelled
 * honestly. It has nothing to do with class.
 *
 * The amount is the catch. Both value columns are per-LINE totals -- one point's
 * worth times the amount -- and this file has to hand back PER-POINT weights,
 * because the engines apply their own amounts (a 12% potential line, a tier-7 flame).
 * Feed totals straight in and every row is counted twice over, by a different factor
 * each (12x for a 12% line, 9x for a 9% one), which reorders the ranking rather than
 * just inflating it.
 *
 * So amounts are divided back out here, from `opts.amounts`. The amount column does
 * not survive select-and-copy from the site, hence the UI inputs; a paste that DOES
 * carry three columns is parsed directly and wins over the UI. With every amount at
 * 1 -- the default -- this is a no-op and a per-point paste works unchanged.
 *
 * Dividing MapleScouter's own defaults out of the Main Stat column reproduces the
 * per-point figures exactly, including HP 30/30 = 1.
 *
 * No threshold anywhere in this tool may compare these weights to an absolute
 * constant -- only to each other. The scale is set by whichever row MapleScouter
 * normalised, which differs by class.
 *
 * A stat-equivalent paste looks like:
 *
 *     Boss Damage         12.53
 *     M.Attack             2.99
 *     M.Attack%           53.59
 *     Critical Dmg        41.26
 *     Ignore Dff(300)      3.8
 *     Ignore Dff(380)      4.86
 *     INT                  1
 *     INT%                12.21
 *     Not Affected by % INT 0.14
 *     LUK                  0.1
 *     LUK%                 1.64
 *     All Stat%           13.84
 *
 * These are local derivatives at the character's current gear, which is exactly
 * the right thing for pricing one marginal upgrade -- and a reason to re-paste
 * after any big change.
 * ======================================================================== */

const STAT_NAMES = ['STR', 'DEX', 'INT', 'LUK'];

// normalised label -> weight key. Exact matches only, so "Not Affected by % INT"
// can't be mistaken for "INT".
const SCOUTER_LABELS = {
  'str': 'flat.STR', 'dex': 'flat.DEX', 'int': 'flat.INT', 'luk': 'flat.LUK',
  'str%': 'pct.STR', 'dex%': 'pct.DEX', 'int%': 'pct.INT', 'luk%': 'pct.LUK',

  'not affected by % str': 'nopct.STR',
  'not affected by % dex': 'nopct.DEX',
  'not affected by % int': 'nopct.INT',
  'not affected by % luk': 'nopct.LUK',

  'all stat%': 'allStatPct',
  'all stats%': 'allStatPct',

  'attack': 'attFlat',
  'att': 'attFlat',
  'm.attack': 'mattFlat',
  'magic attack': 'mattFlat',
  'matt': 'mattFlat',

  'attack%': 'attPctPhys',
  'att%': 'attPctPhys',
  'm.attack%': 'attPctMagic',
  'magic attack%': 'attPctMagic',
  'matt%': 'attPctMagic',

  'boss damage': 'boss',
  'boss dmg': 'boss',
  'boss': 'boss',

  'critical dmg': 'critDmg',
  'critical damage': 'critDmg',
  'crit dmg': 'critDmg',

  'ignore dff(300)': 'ied300',
  'ignore dff(380)': 'ied380',
  'ignore def(300)': 'ied300',
  'ignore def(380)': 'ied380',
  'ied(300)': 'ied300',
  'ied(380)': 'ied380',

  'hp%': 'hpPct',
  'max hp%': 'hpPct',
  'hp': 'hpFlat',
  'max hp': 'hpFlat',
  'not affected by % hp': 'nopct.HP',
};

// MapleScouter's own default amounts, so "fill defaults" matches an untouched page.
// One realistic line of each kind: a 12% stat line, a 9% all-stat line, 40% boss.
const SCOUTER_DEFAULT_AMOUNTS = {
  boss: 40, critDmg: 8, ied300: 40, ied380: 40,
  attFlat: 30, mattFlat: 30, attPctPhys: 12, attPctMagic: 12,
  hpFlat: 30, hpPct: 12, 'nopct.HP': 200,
  allStatPct: 9,
  'flat.STR': 30, 'flat.DEX': 30, 'flat.INT': 30, 'flat.LUK': 30,
  'pct.STR': 12, 'pct.DEX': 12, 'pct.INT': 12, 'pct.LUK': 12,
  'nopct.STR': 200, 'nopct.DEX': 200, 'nopct.INT': 200, 'nopct.LUK': 200,
};

function normLabel(s) {
  return s.toLowerCase()
    .replace(/\s+/g, ' ')
    .replace(/\s*%\s*$/, '%')
    .replace(/\s*\(\s*/g, '(')
    .replace(/\s*\)\s*/g, ')')
    .trim();
}

/**
 * Parse a pasted table. Each line is a label then a number, separated by tabs or
 * runs of spaces. Returns the raw key/value map plus which rows were used, so the
 * UI can show anything it didn't recognise instead of silently dropping it.
 */
function parseScouter(text) {
  const raw = {};
  const rows = [];
  const amounts = {};   // only populated when the paste carried three columns
  let percent = false;

  for (const line of String(text || '').split(/\r?\n/)) {
    if (!line.trim()) continue;
    // Last numeric token is the value, everything before it the label. The
    // trailing %? is needed for the Final Damage column, where every row ends in
    // "%"; without it those rows matched nothing and the tool rendered blank.
    //
    // Two numbers means the amount column came along, so the first is the amount.
    // Tried first, but only kept when it yields a label we recognise -- otherwise a
    // label ending in a bare number would eat its own last word as an amount.
    let label = null, amount = null, value = null, pct = '';
    const three = line.match(/^(.*?)[\t ]+(-?[\d.,]+)[\t ]+(-?[\d.,]+)\s*(%?)\s*$/);
    if (three && SCOUTER_LABELS[normLabel(three[1].trim())]) {
      label = three[1].trim();
      amount = parseFloat(three[2].replace(/,/g, ''));
      value = parseFloat(three[3].replace(/,/g, ''));
      pct = three[4];
    } else {
      const m = line.match(/^(.*?)[\t ]+(-?[\d.,]+)\s*(%?)\s*$/);
      if (!m) { rows.push({ label: line.trim(), value: null, key: null }); continue; }
      label = m[1].trim();
      value = parseFloat(m[2].replace(/,/g, ''));
      pct = m[3];
    }
    if (!isFinite(value)) { rows.push({ label, value: null, key: null }); continue; }
    if (pct) percent = true;

    const key = SCOUTER_LABELS[normLabel(label)] || null;
    if (key) {
      raw[key] = value;
      if (isFinite(amount) && amount > 0) amounts[key] = amount;
    }
    rows.push({ label, value, key, amount: isFinite(amount) ? amount : null });
  }
  return { raw, rows, percent, amounts };
}

/**
 * Which row sits at exactly 1 once amounts are divided out, or null if none does.
 *
 * The Main Stat column always has one -- it is what sets the scale, "INT" for a mage
 * and "HP" for a Demon Avenger, which has no natural stat to normalise against. It is
 * also the only thing separating per-point weights from per-line totals, since both
 * use identical row labels. Searched across every parsed row rather than just the
 * stats, because the normaliser is not always a stat.
 *
 * The Final Damage column normalises nothing, so this legitimately returns null for
 * it -- absence alone is not evidence of a mistake, which is why `suspectTotals`
 * needs a second signal.
 *
 * `weightOf` is buildWeights' amount-aware getter, so this asks about the effective
 * weight rather than the pasted number.
 */
function normaliserOf(parsed, weightOf) {
  for (const r of parsed.rows || []) {
    if (r.key && Math.abs(weightOf(r.key) - 1) <= 1e-6) return r.label;
  }
  return null;
}

/**
 * Build the weight set the engines consume.
 *
 * mainStat is normally detected as the largest flat stat weight -- MapleScouter
 * normalises the main stat to 1, and secondaries come out well below it. Pass an
 * override when a build makes that ambiguous.
 *
 * ied picks between the 300 and 380 def columns; which one is right depends on
 * the boss you are gearing for.
 */
function buildWeights(parsed, opts = {}) {
  const raw = parsed.raw || {};
  // Amounts divide the pasted per-line totals back down to per-point. A three-column
  // paste beats the UI inputs, since it came from the page itself. Everything at the
  // default 1 makes this the identity, so a per-point paste is untouched.
  const amountOf = (k) => {
    const fromPaste = Number((parsed.amounts || {})[k]);
    if (isFinite(fromPaste) && fromPaste > 0) return fromPaste;
    const fromUi = Number((opts.amounts || {})[k]);
    return isFinite(fromUi) && fromUi > 0 ? fromUi : 1;
  };
  const g = (k) => (k in raw ? Number(raw[k] || 0) / amountOf(k) : 0);

  let mainStat = opts.mainStat;
  if (!mainStat || !STAT_NAMES.includes(mainStat)) {
    mainStat = STAT_NAMES.reduce(
      (best, s) => (g('flat.' + s) > g('flat.' + best) ? s : best), 'STR');
  }

  // Star force raises every class-relevant stat by the same amount, so one point
  // of "Class Stat" is worth the sum of the flat weights -- 1 + 0.1 = 1.1 for a
  // mage, and correctly larger for a build like Xenon that uses three stats.
  const statPerPoint = STAT_NAMES.reduce((a, s) => a + g('flat.' + s), 0);

  const iedVariant = opts.iedVariant === 380 ? 380 : 300;

  // Both of these read the weights AFTER dividing, not the pasted numbers -- the
  // question is whether what the engines will consume is per-point, and that is only
  // true once the amounts are right. Dividing MapleScouter's defaults out of the Main
  // Stat column lands HP back on exactly 1, so the normaliser reappears and the
  // warning goes quiet by itself once the amounts are entered.
  const normaliser = normaliserOf(parsed, g);
  const values = (parsed.rows || [])
    .filter(r => r.key && isFinite(r.value)).map(r => Math.abs(g(r.key)));

  // Star force adds the same amount to every class-relevant stat, so it only ever
  // needs the sum. Flames don't: a single-stat line hits one stat while a combo
  // line hits two, so the per-stat split has to survive.
  const flatByStat = {};
  for (const s of STAT_NAMES) flatByStat[s] = g('flat.' + s);

  // % weight per individual stat, for classes where more than one stat's % lines
  // carry real value (Xenon runs on three). Single-stat classes only ever read
  // the main stat's entry.
  const pctByStat = {};
  for (const s of STAT_NAMES) pctByStat[s] = g('pct.' + s);

  return {
    mainStat,
    statPerPoint,
    flatByStat,
    pctByStat,
    // Flat attack, whichever of the two the class actually uses -- a flame line
    // reads "Attack Power +N" or "Magic ATT +N" depending on the weapon, and only
    // one of the two weights is ever non-zero.
    attFlat: g('attFlat') || g('mattFlat'),

    // potential lines
    mainPct:    g('pct.' + mainStat),
    allStatPct: g('allStatPct'),
    attPct:     g('attPctPhys') + g('attPctMagic'),  // only one is ever non-zero
    boss:       g('boss'),
    ied:        iedVariant === 380 ? g('ied380') : g('ied300'),
    critDmg:    g('critDmg'),
    hpPct:      g('hpPct'),
    // flat max HP -- worthless to most classes, but it is Demon Avenger's whole
    // game: MathBro's DA flame branch scores hp_tier * hp_per_tier with no
    // equivalence multiplier at all, because HP IS the currency there.
    hpFlat:     g('hpFlat'),
    // Damage% IS boss damage%. Same weight, the only difference being that boss%
    // applies to bosses only -- which is all this tool is optimising for. MathBro
    // does the same: worker.js:755 multiplies both by one shared
    // `stat_equivalences.dmg`, differing only by boss counting 2 per flame tier to
    // damage's 1. MapleScouter never emits a separate damage row, so there is
    // nothing to parse and no fallback to arrange.
    dmgPct:     g('boss'),

    // flat attack from star force
    att:  g('attFlat'),
    matt: g('mattFlat'),

    iedVariant,
    // which value column arrived; only affects how columns are labelled
    unit: parsed.percent ? '%fd' : 'stat',
    // the row that set the scale -- "INT" for a mage, "HP" for a Demon Avenger.
    // null for the Final Damage column, which normalises nothing.
    normalizedTo: normaliser,
    // What each row was divided by, so the UI can show what is actually in force
    // rather than only what was typed. Keyed the same as the weights.
    amounts: Object.keys(raw).reduce((a, k) => (a[k] = amountOf(k), a), {}),
    amountsFromPaste: Object.keys(parsed.amounts || {}).length > 0,
    // Two independent signals that per-line totals were pasted with the amounts
    // still at 1: nothing sits at 1, and nothing is below 1 either (a real per-point
    // paste always carries small rows -- "Not Affected by %" lands near 0.1, and
    // secondary stats lower still). Requiring both keeps a legitimate paste from
    // being scolded on one coincidence. Only meaningful for the Main Stat column;
    // Final Damage normalises nothing and its rows are all sub-1 anyway, so it is
    // excluded rather than false-flagged -- a real gap, noted in the README.
    suspectTotals: !parsed.percent && !normaliser && values.length > 0
                   && Math.min.apply(null, values) > 1,
    // a pure-HP Demon Avenger paste has near-zero stat weights but is not empty
    empty: statPerPoint === 0 && !g('hpFlat'),
  };
}

/**
 * Human-readable readout of what the weight set implies about the class. This is
 * the answer to "where is the class selector": the paste already encodes the
 * class, and this line makes the inference visible instead of magic.
 */
function weightsProfileText(w) {
  const flats = w.flatByStat || {};
  // Thresholds are RELATIVE to the biggest weight, never absolute. The percent
  // format normalises nothing, so a Xenon's flats there are ~0.12 rather than ~1
  // and any fixed cutoff would misread every class.
  const top = Math.max(...STAT_NAMES.map(s => flats[s] || 0), 0);
  const primaries = STAT_NAMES.filter(s => top > 0 && (flats[s] || 0) >= 0.5 * top);
  const secondaries = STAT_NAMES.filter(s =>
    (flats[s] || 0) > 0 && !primaries.includes(s));
  const bits = [];
  // Demon Avenger scales off HP%, so HP% outweighing the stat's own % is the
  // scale-free signature -- true in both formats.
  if ((w.hpFlat || 0) > 0 && (w.hpPct || 0) >= (w.mainPct || 0)) {
    bits.push('HP-based build (Demon Avenger)');
  } else if (primaries.length > 1) {
    bits.push(primaries.join('/') + ' all primary (Xenon-style)');
  } else {
    bits.push(`${w.mainStat} main` + (secondaries.length ? `, ${secondaries.join('/')} secondary` : ''));
  }
  bits.push(cubeStatCollapsed(w)
    ? 'main% and all-stat% priced as one currency'
    : 'all-stat% kept at its own, higher weight');
  const subs = cubeSubStats(w);
  if (subs.length) bits.push('counting ' + subs.map(s => s + '%').join(' and ') + ' potential lines');
  if ((w.hpFlat || 0) > 0) bits.push('flat-HP flame lines valued');
  const divided = Object.keys(w.amounts || {}).filter(k => w.amounts[k] !== 1);
  if (divided.length) {
    bits.push(`${divided.length} row${divided.length > 1 ? 's' : ''} divided by `
      + `${w.amountsFromPaste ? 'amounts in the paste' : 'the amounts you set'}`);
  }
  if (w.suspectTotals) {
    bits.push('SCALE UNVERIFIED - no row lands on 1, so amounts are probably needed');
  } else {
    bits.push(w.unit === '%fd'
      ? 'the Final Damage column, so costs read as meso per 1% final damage'
      : `the Main Stat column, per point, scaled against ${w.normalizedTo || 'the main stat'} = 1`);
  }
  return bits.join(' · ');
}

/** Rows it did not recognise -- shown so a mapping gap is visible, not silent. */
function scouterUnknownRows(parsed) {
  return (parsed.rows || []).filter(r => !r.key);
}

/* ==== js/flames.js ==== */
/* ===========================================================================
 * Flames (bonus stats).
 *
 * Every constant here is taken from MathBro's flame calculator, specifically
 * reference/MathBro's Flaming Calculator_files/worker.js -- NOT from the copy of

 * (main has 4:0/7:0.03, worker has 4:0.01/7:0.02). worker.js is the file that

 *
 *   - A flame-advantaged item rolls exactly 4 lines, drawn as a uniform 4-subset
 *     of 19 possible bonus-stat slots (21 on a weapon, which adds boss% and
 *     damage%).

 *     shifts DOWN by two, so the range becomes 1-5 instead of 3-7. Both effects
 *     together make advantage worth a great deal.

const FLAME_TYPE_LABELS = Object.fromEntries(FLAME_TYPES);

/** Fall back to eternal for a type that is no longer offered. */

  '200+':    { 3: 0.18, 4: 0.264, 5: 0.363,  6: 0.47916, 7: 0.614922 },

  '160-199': { 1: 0.05, 2: 0.11,  3: 0.185,  4: 0.2662,  5: 0.366025, 6: 0.43923,  7: 0.512435 },
  '200+':    { 1: 0.06, 2: 0.132, 3: 0.2178, 4: 0.31944, 5: 0.43923,  6: 0.527076, 7: 0.614922 },
