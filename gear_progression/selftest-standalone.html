const FLAME_DMG_PER_TIER = 1;

// Total bonus-stat slots a roll draws from. Exactly two pools exist: a weapon rolls
// from 21 (the 19 plus boss% and damage%), everything else from 19. Level changes
// the per-tier values, never the pool.
const FLAME_SLOTS_ARMOR = 19;
const FLAME_SLOTS_WEAPON = 21;

const FLAME_STATS = ['STR', 'DEX', 'INT', 'LUK'];

function flameBracket(table, level) {
  for (const [lo, hi, v] of table) if (level >= lo && level <= hi) return v;
  return level > 250 ? table[table.length - 1][2] : 0;
}

/** Tier -> probability, shifted down by 2 for a non-advantaged item. */
function flameTierProbs(flameType, nonAdvantaged) {
  const base = FLAME_TIER_PROBS[flameType] || FLAME_TIER_PROBS.eternal;
  if (!nonAdvantaged) return base;
  const out = {};
  for (const t in base) out[Number(t) - 2] = base[t];
  return out;
}

function _comb(n, r) {
  if (r < 0 || r > n) return 0;
  let v = 1;
  for (let i = 0; i < r; i++) v = v * (n - i) / (i + 1);
  return v;
}

/**
 * The bonus-stat slots worth anything to this character, each with the value it
 * contributes at a given tier.
 *
 * Only nonzero slots are enumerated; everything else is left in the junk pool.
 * That is self-consistent for any weight set -- P(a specific k-subset of the
 * tracked slots is present) = C(junk, lines-k)/C(total, lines), and Vandermonde's
 * identity makes those sum to 1 regardless of how many slots are tracked.
 *
 * Sanity check on the inventory: for a mage the tracked slots come to exactly 9
 * (main, secondary, the 5 pairs containing one of them, all-stat, MATT), leaving
 * 10 junk out of 19 -- which is precisely the `choose_from = 10` constant in
 * MathBro's own code.
 */
function flameTrackedSlots(kind, level, w, opts = {}) {
  const { baseAtt = 0, nonAdvantaged = false } = opts;
  const isWeapon = kind === 'weapon' || kind === 'secondary';
  const flat = w.flatByStat || {};
  const statPer = flameBracket(FLAME_STAT_PER_TIER, level);
  const comboPer = flameBracket(FLAME_COMBO_PER_TIER, level);
  const slots = [];
  const lin = (label, coeff) => {
    if (coeff) slots.push({ label, at: (t) => coeff * t });
  };

  for (const s of FLAME_STATS) lin(s, statPer * (flat[s] || 0));

  // combo lines grant the combo amount to BOTH stats in the pair
  for (let i = 0; i < FLAME_STATS.length; i++) {
    for (let j = i + 1; j < FLAME_STATS.length; j++) {
      const a = FLAME_STATS[i], b = FLAME_STATS[j];
      lin(`${a}+${b}`, comboPer * ((flat[a] || 0) + (flat[b] || 0)));
    }
  }

  lin('all stat', w.allStatPct);

  // flat max HP -- Demon Avenger's whole game, zero weight for everyone else,
  // in which case it stays untracked and the junk count is unaffected
  lin('HP', flameBracket(FLAME_HP_PER_TIER, level) * (w.hpFlat || 0));

  if (isWeapon) {
    // weapon attack is a fraction of base attack and the fractions are not
    // linear in tier, so this slot needs the table rather than a coefficient
    const tbl = (nonAdvantaged ? FLAME_WATT_NON_ADV : FLAME_WATT_ADV)[
      level >= 200 ? '200+' : '160-199'];
    for (const [label, weight] of [['ATT', w.att], ['MATT', w.matt]]) {
      if (weight) {
        slots.push({ label, at: (t) => baseAtt * (tbl[t] || 0) * weight });
      }
    }
    lin('boss', FLAME_BOSS_PER_TIER * w.boss);
    lin('damage', FLAME_DMG_PER_TIER * (w.dmgPct || 0));
  } else {
    lin('ATT', w.att);
    lin('MATT', w.matt);
  }

  return slots;
}

/**
 * Full distribution of the flame score a reroll produces, as a sorted array of
 * { score, prob }. Exact, not sampled: at most sum over k of C(|tracked|,k)*5^k
 * outcomes, which is about 90k for armour and 150k for a weapon.
 */
// ~38k leaves per slot, and the distribution is independent of what the item
// already has, so cache it and let only flameReroll() re-run while typing.
const _flameCache = new Map();

function flameCacheClear() { _flameCache.clear(); }

function flameDistributionCached(kind, level, w, opts = {}) {
  // Every weight field flameTrackedSlots reads must be in here, or two characters that
  // differ only in an omitted one share a wrong distribution. hpFlat was missing, which
  // meant a Demon Avenger and a mage with otherwise identical listed weights collided --
  // latent while only one character was ever computed per session, and reachable the
  // moment the compare panel started switching between them.
  const key = [kind, level, opts.flameType, !!opts.nonAdvantaged, opts.baseAtt || 0,
               w.mainStat, w.allStatPct, w.att, w.matt, w.boss, w.dmgPct || 0,
               w.hpFlat || 0,
               JSON.stringify(w.flatByStat || {})].join('|');
  let hit = _flameCache.get(key);
  if (!hit) {
    hit = flameDistribution(kind, level, w, opts);
    _flameCache.set(key, hit);
  }
  return hit;
}

function flameDistribution(kind, level, w, opts = {}) {
  const { flameType = 'eternal', nonAdvantaged = false } = opts;
  const isWeapon = kind === 'weapon' || kind === 'secondary';
  const total = isWeapon ? FLAME_SLOTS_WEAPON : FLAME_SLOTS_ARMOR;

  const tracked = flameTrackedSlots(kind, level, w, opts);
  const junk = total - tracked.length;
  if (junk < 0) return [];

  const tp = flameTierProbs(flameType, nonAdvantaged);
  const tiers = Object.keys(tp).map(Number).filter(t => tp[t] > 0);

  const lineCounts = nonAdvantaged ? FLAME_LINES_NON_ADV : { 4: 1 };

  // P(exactly k of the tracked slots appear), summed over how many lines rolled
  const subsetProb = [];
  for (let k = 0; k <= 4; k++) {
    let p = 0;
    for (const L in lineCounts) {
      const n = Number(L);
      if (k > n) continue;
      p += lineCounts[L] * _comb(junk, n - k) / _comb(total, n);
    }
    subsetProb[k] = p;
  }

  const acc = new Map();
  const add = (score, prob) => {
    if (prob <= 0) return;
    const key = Math.round(score * 100) / 100;
    acc.set(key, (acc.get(key) || 0) + prob);
  };

  // Walk every subset of the tracked slots up to size 4, with every tier
  // assignment. Emit ONLY at a leaf -- once every tracked slot has been decided
  // present or absent. Emitting at interior nodes as well would count a partial
  // subset and then count its own extensions again, which inflates the total mass
  // (it read 3.90 instead of 1 before this was fixed).
  const walk = (idx, chosen, score, prob) => {
    if (idx >= tracked.length || chosen === 4) {
      // any remaining slots are implicitly absent, so this is one complete outcome
      add(score, prob * subsetProb[chosen]);
      return;
    }
    walk(idx + 1, chosen, score, prob);                 // slot absent
    for (const t of tiers) {                            // slot present at tier t
      walk(idx + 1, chosen + 1, score + tracked[idx].at(t), prob * tp[t]);
    }
  };
  walk(0, 0, 0, 1);

  return [...acc.entries()]
    .map(([score, prob]) => ({ score, prob }))
    .sort((a, b) => a.score - b.score);
}

/**
 * What one reroll is worth against what the item already has.
 *
 * gainPerRoll is E[max(0, new - current)] -- you keep the better outcome, so a
 * worse roll costs nothing but the flame. That is the figure the flame table
 * ranks on. rollsToBeat is the mean of the geometric distribution, i.e. how many
 * flames it takes to see any improvement at all.
 */
function flameReroll(dist, currentValue = 0) {
  let mass = 0, eScore = 0, pImprove = 0, gain = 0, best = 0;
  for (const { score, prob } of dist) {
    mass += prob;
    eScore += prob * score;
    best = Math.max(best, score);
    if (score > currentValue) {
      pImprove += prob;
      gain += prob * (score - currentValue);
    }
  }
  return {
    mass,                     // must be 1; exposed so the self test can assert it
    expected: eScore,
    max: best,
    pImprove,
    gainPerRoll: gain,
    rollsToBeat: pImprove > 0 ? 1 / pImprove : Infinity,
    expectedIfBetter: pImprove > 0 ? gain / pImprove + currentValue : 0,
  };
}

/* ------------------------------------------------------------- meso reset ---
 *
 * Bonus stats can be reset for a flat meso price instead of consuming a flame
 * item. That is what lets flames into the main ranking at all: its denominator
 * is meso per point of main stat, and until this existed a flame had no meso
 * price to divide by.
 *
 * Two things from the patch note drive everything here.
 *
 *   - It costs FLAME_RESET_MESO per reset.
 *   - "The reset rates are identical to Black Rebirth Flames", i.e. the
 *     `eternal` distribution above -- NOT whichever flame the slot is set to in
 *     the flames panel. That panel is about flames you own; this is about
 *     mesos, so it always prices the eternal rates.
 *
 * Flame advantage is still taken from the slot: it is a property of the item and
 * class pairing, not of the flame item being consumed, so the meso reset does
 * not change it.
 */
const FLAME_RESET_MESO = 3000000;
const FLAME_RESET_TYPE = 'eternal';

/**
 * Cost and gain of "reset until it beats what is there, then keep it".
 *
 * The patch lets you choose whether to apply the new bonus stats, so a bad reset
 * costs only the mesos -- exactly the E[max(0, new - now)] that flameReroll
 * already models, which is why no new probability work is needed here.
 *
 * Both the cost and the gain scale with how many resets it takes, and the
 * scaling cancels:
 *
 *   E[resets] = 1 / p
 *   E[cost]   = price / p
 *   E[gain]   = gainPerRoll / p     (the gain given that you stopped on an improvement)
 *   per       = cost / gain         = price / gainPerRoll
 *
 * So the headline meso-per-point does not depend on how many resets it takes --
 * only on how much one reset adds on average. rollsToBeat still sets the cost
 * column, because that is the meso the plan actually consumes.
 *
 * `pct` follows the ranking's percentile box: blank is the mean number of
 * resets, 85 is enough resets to be 85% sure of seeing an improvement. Exact
 * rather than fitted, because reset count is geometric -- the same footing as
 * the cube percentile, not the lognormal star force one.
 */
function flameResetPlan(reroll, pct = 0, price = FLAME_RESET_MESO) {
  // pImprove 0 means the item already holds the best roll the pool can produce,
  // so there is nothing to buy at any price.
  if (!(reroll.pImprove > 0) || !(reroll.gainPerRoll > 0)) {
    return { resets: Infinity, cost: Infinity, gain: 0, per: Infinity };
  }
  const resets = pct ? geometricPct(reroll.pImprove, pct) : reroll.rollsToBeat;
  const gain = reroll.gainPerRoll / reroll.pImprove;
  const cost = resets * price;
  return { resets, cost, gain, per: cost / gain };
}

/*
 * The six numbers a flame can contribute, as read straight off the item.
 * Keys are the per-slot state fields; the label is the column heading.
 */
/*
 * One column per stat, not Main/Sec. Main/Sec was a two-stat worldview: the Sec
 * column multiplied a single typed number by the SUM of every non-main weight,
 * which is only correct when exactly one secondary exists (a mage's LUK). A
 * Xenon has three primaries and a Shadower two secondaries with different
 * weights -- their flames were impossible to enter correctly. Per-stat columns
 * are exact for every class, and the ones the paste gives no weight to are
 * hidden, so each class only ever sees its own stats.
 */
const FLAME_INPUTS = [
  ['fSTR',  'STR',   'flat STR from the flame'],
  ['fDEX',  'DEX',   'flat DEX from the flame'],
  ['fINT',  'INT',   'flat INT from the flame'],
  ['fLUK',  'LUK',   'flat LUK from the flame'],
  ['fAtt',  'Atk',   'flat attack or magic attack'],
  ['fHp',   'HP',    'flat max HP (Demon Avenger)'],
  ['fAll',  'All%',  'all stat %'],
  ['fDmg',  'Dmg%',  'damage %'],
  ['fBoss', 'Boss%', 'boss damage %'],
];

// stat and HP columns disappear entirely when the paste gives them no weight;
// the rest stay visible and merely warn if filled against a zero weight
const FLAME_INPUTS_HIDEABLE = new Set(['fSTR', 'fDEX', 'fINT', 'fLUK', 'fHp']);

/**
 * What an item's existing flame is worth, from the amounts shown on the item.
 *
 * Replaces asking for one pre-computed score: these are numbers readable straight
 * off the equip window, converted with the same weights the reroll distribution
 * uses, so "now" and "after" sit on one scale by construction.
 */
function flameCurrentValue(f, w) {
  if (!f) return 0;
  let total = 0;
  for (const [key] of FLAME_INPUTS) {
    total += Number(f[key] || 0) * flameInputWeight(key, w);
  }
  return total;
}

/**
 * The flame in main-stat points -- the figure people quote as a "flame score".
 *
 * Every other column follows the paste's unit, which for a Final Damage paste is
 * %fd: a strong flame reads "1.32", which means nothing to anyone used to hearing
 * "130 flame score". Dividing by the main stat's own weight -- %fd per point in
 * that mode, exactly 1 in stat mode -- recovers the familiar number. So in stat
 * mode this equals Now, and in %fd mode it is Now translated. Either way it is
 * invariant to how the paste was scaled, which is the property that makes it
 * comparable across characters and between pastes.
 *
 * Demon Avenger's currency is HP, and hpFlat is the one flat weight that
 * dominates only for that class, so the larger of the two decides. Zero means the
 * paste carries no row to convert with, and there is no honest number to show.
 */
function flameScoreDivisor(w) {
  if (!w) return 0;
  const main = (w.flatByStat && w.flatByStat[w.mainStat]) || 0;
  return Math.max(main, w.hpFlat || 0);
}

function flameScore(value, w) {
  const d = flameScoreDivisor(w);
  return d > 0 ? value / d : NaN;
}

/**
 * The weight one point of a given flame input converts at.
 *
 * Single source of truth so the UI can warn about a weight of zero using exactly
 * the number the valuation uses. A zero here means the amount typed in that column
 * contributes nothing -- which is the case for Dmg% unless the MapleScouter paste
 * actually carries a damage weight, since most of them don't.
 */
function flameInputWeight(key, w) {
  switch (key) {
    case 'fSTR': case 'fDEX': case 'fINT': case 'fLUK':
      return (w.flatByStat && w.flatByStat[key.slice(1)]) || 0;
    case 'fAtt':  return w.attFlat || 0;
    case 'fHp':   return w.hpFlat || 0;
    case 'fAll':  return w.allStatPct || 0;
    case 'fDmg':  return w.dmgPct || 0;
    case 'fBoss': return w.boss || 0;
    default:      return 0;
  }
}

/**
 * Slots that can carry flames.
 *
 * Armour, the weapon, the accessories, the pocket item and the medal. Note what is
 * NOT here, all three confirmed rather than assumed:
 *
 *   secondary -- takes potential but no flames, despite sitting beside the weapon
 *                everywhere else in this tool
 *   shoulder  -- no flames, even though it is part of the armour set and every
 *                other piece of that set does take them
 *   emblem    -- no flames
 *   rings     -- no flames, even though pendants and earrings do take them
 *
 * The pocket item is flame-only: it takes no potential (see SLOTS in app.js) but
 * does take bonus stats.
 *
 * There are only two bonus-stat pools: weapons and everything else. Which one
 * applies depends on the equip being a weapon, and the *values* then scale with
 * item level -- there is no per-slot pool. So accessories, the pocket item and the
 * medal all correctly share the 19-slot non-weapon pool with armour; that is the
 * rule, not an approximation standing in for missing data.
 */
const FLAMEABLE = new Set([
  'hat', 'top', 'bottom', 'shoes', 'gloves', 'cape', 'belt',
  'weapon',
  'face', 'eye', 'ear', 'pend1', 'pend2',
  'pocket', 'medal',
]);
</script>

/* ---------- level shifts values, never probabilities ---------- */
section('cubing.js level-invariant probabilities');
// The lv160+ rule adds +1 per line and leaves the odds untouched, so the chance of
// 33% on a 160 item is *identically* the chance of 30% on a 150 one -- same three
// lines, each worth one more. Verified against every armour pool.
function pStat(ct, cat, lvl, thresh) {
  return cubeCombos(ct, cat, lvl)
    .filter(c => (c.sums.main_stats || 0) + (c.sums.all_stats || 0) >= thresh)
    .reduce((a, c) => a + c.prob, 0);
}
for (const cat of ['hat', 'top', 'bottom', 'shoes', 'acc', 'heart']) {
  for (const ct of ['black', 'red']) {
    check(`${cat}/${ct}: P(>=33 @160) = P(>=30 @150)`,
      pStat(ct, cat, 160, 33), pStat(ct, cat, 150, 30), 1e-15);
  }
}
// It holds because the bump is per LINE, not a shift of the whole distribution: a
// roll of two stat lines plus a Zero gains only +2, so the equivalence is per
// composition. At thresholds two lines can reach, +3 over-corrects and the
// probabilities genuinely differ -- which is correct, not a bug.
check('two-line thresholds are NOT +3 equivalent',
  Math.abs(pStat('black', 'hat', 160, 24) - pStat('black', 'hat', 150, 21)) > 1e-6, true);
check('a Zero line does not gain a point',
  pStat('black', 'hat', 160, 26) > 0 && pStat('black', 'hat', 160, 27) < pStat('black', 'hat', 160, 26), true);

section('enhancement mode policy');
// The ranking prices the strategy you picked, rather than searching for the cheapest.
// Presets are one digit per star, 15->16 up to 21->22, grouped 15-18 / 18-20 / 20-22.
const POL = (modes) => ({ mvp: 0, event: 'ssf', catching: true, itemCost: 0, modes });
const P111 = POL(SF_MODE_PRESETS['111/11/11']);
const P444_11_44 = POL(SF_MODE_PRESETS['444/11/44']);
const P444 = POL(SF_MODE_PRESETS['444/44/44']);

check('every preset covers them all',
  Object.keys(SF_MODE_PRESETS).every(k => SF_MODE_PRESETS[k].length === 7), true);
check('the name round-trips', sfModesName(SF_MODE_PRESETS['444/11/44']), '444/11/44');
check('  ... for all three',
  Object.keys(SF_MODE_PRESETS).every(k => sfModesName(SF_MODE_PRESETS[k]) === k), true);

// mode lookup only applies inside the band
check('mode 4 applies at 15', sfModeIndex(P444, 15), 3);
check('  ... and at 21', sfModeIndex(P444, 21), 3);
check('no mode choice at 22', sfModeIndex(P444, 22), 0);
check('nor at 14', sfModeIndex(P444, 14), 0);

// mode 4 cannot boom, so a fully safeguarded 15->22 climb destroys nothing
check('444/44/44 booms exactly zero times, 15->22',
  sfClimb(150, 15, 22, P444).booms, 0, 1e-12);
check('  ... and 111/11/11 does not', sfClimb(150, 15, 22, P111).booms > 1, true);
check('  ... nor does 444/11/44 (the middle is unguarded)',
  sfClimb(150, 15, 22, P444_11_44).booms > 0, true);
// zero booms means zero variance from re-climbing, so the cost is a pure geometric sum
check('a no-boom climb still has spread', sfClimb(150, 15, 22, P444).variance > 0, true);

// the point of the trade: safety costs meso
const c111 = sfClimb(150, 15, 22, P111).cost;
const cMid = sfClimb(150, 15, 22, P444_11_44).cost;
const c444 = sfClimb(150, 15, 22, P444).cost;
check('safeguarding everything costs the most', c444 > cMid, true);
check('  ... and the middle strategy more than none', cMid > c111, true);
check('  ... with 111 cheapest in expected meso', c111 < cMid && c111 < c444, true);
// and fewer booms the other way
check('booms run the opposite direction',
  sfClimb(150, 15, 22, P111).booms > sfClimb(150, 15, 22, P444_11_44).booms, true);

// The optimiser is no longer the ranking path, but it still bounds it: no fixed
// policy can beat the mode-by-mode optimum with the same event and item cost.
(() => {
  const { V } = solveUnconstrained(150, 0, true, true, true, 22, 0);
  for (const [name, cfg] of Object.entries({
    '111/11/11': P111, '444/11/44': P444_11_44, '444/44/44': P444,
  })) {
    check(`${name} is never cheaper than the optimum`,
      sfClimb(150, 15, 22, cfg).cost >= V[15] - 1, true);
  }
  // with free spares mode 1 IS the optimum nearly everywhere, so 111 should match it
  check('111/11/11 matches the optimum when spares are free',
    sfClimb(150, 15, 22, P111).cost, V[15], Math.abs(V[15]) * 1e-9);
})();

// which stars a mode change can reach
(() => {
  const a = POL([0, 0, 0, 0, 0, 0, 0]);
  const b = POL([0, 0, 3, 0, 0, 0, 0]);          // safeguard 17->18 alone
  const CFG_POL_LATER = POL([0, 0, 0, 0, 0, 3, 0]);  // safeguard 20->21 alone
  check('one star switched changes 17→18',
    sfClimb(150, 17, 18, a).cost !== sfClimb(150, 17, 18, b).cost, true);
  // It changes 18→19 as well, and that is correct rather than leakage: a boom at 18★
  // regresses to recoveryStar(18) = 12★, so recovery re-walks 17→18 under whatever
  // mode is set there. The dependency runs strictly backwards.
  check('  ... and 18→19 too, since its boom recovery re-walks 17→18',
    sfClimb(150, 18, 19, a).cost !== sfClimb(150, 18, 19, b).cost, true);
  check('  ... because a boom at 18★ drops to 12★', recoveryStar(18), 12);
  // but a later star can never reach backwards
  check('a mode set at 20 does not touch 18→19',
    sfClimb(150, 18, 19, a).cost, sfClimb(150, 18, 19, CFG_POL_LATER).cost, 1e-9);
  check('  ... though it does touch 20→21',
    sfClimb(150, 20, 21, a).cost !== sfClimb(150, 20, 21, CFG_POL_LATER).cost, true);
  check('  ... and the cache keeps every policy apart',
    sfClimb(150, 15, 22, a).cost !== sfClimb(150, 15, 22, b).cost, true);
})();

// labels quote the rate actually faced, so the event has to move them
check('mode labels react to the event',
  sfModeLabel(17, 0, POL(SF_MODE_PRESETS['111/11/11']))
  !== sfModeLabel(17, 0, { mvp: 0, event: 'none', catching: true, itemCost: 0,
                           modes: SF_MODE_PRESETS['111/11/11'] }), true);
check('mode 4 is labelled as unable to boom',
  sfModeLabel(17, 3, P444).indexOf('no boom') >= 0, true);

section('endgame weapons (Genesis / Destiny)');
// Genesis (lv200) and Destiny (lv250) arrive at a fixed 22 stars from liberation
// quests. Second-stage Destiny liberation unlocks 22->25, and a boom there costs more
// than a single fee can express: 10b revives the weapon at 12 stars, then either 54.2b
// buys a guaranteed 22 or you re-star-force 12->22 yourself.
const RULE = WEAPON_KINDS.destiny2;
const DST = { mvp: 0, event: 'ssf', catching: true, itemCost: 0,
              modes: SF_MODE_PRESETS['444/11/44'], weaponRule: RULE };
const ORD = { mvp: 0, event: 'ssf', catching: true, itemCost: 0,
              modes: SF_MODE_PRESETS['444/11/44'] };

check('a liberated Destiny climb is finite', isFinite(sfClimb(250, 22, 25, DST).cost), true);
check('the weapon rule is part of the cache key',
  sfClimb(250, 22, 25, DST).cost !== sfClimb(250, 22, 25, ORD).cost, true);
check('an ordinary lv250 weapon still recovers to 17', recoveryStar(22), 17);

// The two routes, and which wins. At lv250 buying back beats re-climbing under every
// preset, but by only ~11b under 444/11/44 -- close enough to be worth computing
// rather than assuming, which is why both are priced every time.
(function () {
  const X = sfPolicy(250, DST).X;
  const sum = (a, b) => X.slice(a, b).reduce((t, v) => t + v, 0);
  check('re-climbing 12->22 costs more than buying the guarantee',
    sum(12, 22) > RULE.guaranteeCost, true);
  check('  ... so the buy route is taken', sfClimb(250, 22, 25, DST).recovery.route, 'buy');
  check('  ... priced at revive + guarantee',
    sfClimb(250, 22, 25, DST).recovery.per, RULE.reviveCost + RULE.guaranteeCost, 1);
  const dear = Object.assign({}, DST, {
    weaponRule: Object.assign({}, RULE, { guaranteeCost: 500e9 }) });
  check('an absurd guarantee flips it to climbing',
    sfClimb(250, 22, 25, dear).recovery.route, 'climb');
  check('  ... and costs more overall',
    sfClimb(250, 22, 25, dear).cost > sfClimb(250, 22, 25, DST).cost, true);
})();

// The correction that mattered: assuming the weapon came back at 22 for the 10b alone
// understated a boom by the entire 12->22 gap.
check('reviving to 12 costs far more than reviving to 22 would',
  sfClimb(250, 22, 25, DST).cost
  > 4 * sfClimb(250, 22, 25, { mvp: 0, event: 'ssf', catching: true, itemCost: 10e9,
                               recoverTo: 22, modes: SF_MODE_PRESETS['444/11/44'] }).cost,
  true);
check('recovery fees dominate the bill',
  sfClimb(250, 22, 25, DST).booms * sfClimb(250, 22, 25, DST).recovery.per
  / sfClimb(250, 22, 25, DST).cost > 0.8, true);

check('the percentile exceeds the mean',
  sfClimbAtPct(sfClimb(250, 22, 25, DST), 85) > sfClimb(250, 22, 25, DST).cost, true);
// Dearer than an ordinary lv250 weapon, but only by ~1.26x, which is not obvious: the
// ordinary one BOOMS MORE (23.4 against 14.1, since it falls to 17/19 and re-climbs
// through the boom-prone stars) while each Destiny boom costs a flat 64.2b. Fewer,
// pricier booms. Asserting a big multiplier here would be inventing a number.
check('  ... and exceeds an ordinary lv250 weapon',
  sfClimbAtPct(sfClimb(250, 22, 25, DST), 85)
  > sfClimbAtPct(sfClimb(250, 22, 25, ORD), 85), true);
check('  ... which booms more often, not less',
  sfClimb(250, 22, 25, ORD).booms > sfClimb(250, 22, 25, DST).booms, true);

(function () {
  const X = sfPolicy(250, DST).X;
  let sum = 0;
  for (let s = 22; s < 25; s++) sum += X[s];
  check('sfClimb sums the same X the policy solved', sum, sfClimb(250, 22, 25, DST).cost, 1);
})();

check('no rule means no recovery block', sfClimb(250, 22, 25, ORD).recovery, null);

section('MapleScouter paste scale');
// The real Demon Avenger paste, normalised to HP = 1 because a DA has no natural
// stat to normalise against. All-stat and STR% come out EXACTLY equal here, which
// is right: a DA benefits from STR alone, so all-stat buys nothing extra.
const DA_REAL = 'Boss Damage\t\t45.68\nAttack\t\t10.19\nAttack%\t\t200.50\n'
  + 'Critical Dmg\t\t140.21\nIgnore Dff(300)\t\t11.65\nIgnore Dff(380)\t\t14.86\n'
  + 'HP\t\t1.00\nHP%\t\t44.57\nNot Affected by % HP\t\t0.14\n'
  + 'STR\t\t1.82\nSTR%\t\t28.08\nNot Affected by % STR\t\t0.62\n'
  + 'All Stat%\t\t28.08';
const pDA = parseScouter(DA_REAL);
const wDA = buildWeights(pDA);
check('every row is recognised', scouterUnknownRows(pDA).length, 0);
check('not treated as empty', wDA.empty, false);
check('normalised against HP, not a stat', wDA.normalizedTo, 'HP');
check('flat HP is the unit', wDA.hpFlat, 1, 1e-9);
check('HP% read', wDA.hpPct, 44.57, 1e-9);
check('STR is the stat', wDA.mainStat, 'STR');
check('flat attack read (physical, not magic)', wDA.attFlat, 10.19, 1e-9);
check('recognised as a DA', weightsProfileText(wDA).indexOf('Demon Avenger') >= 0, true);
check('HP flame column is live', flameInputWeight('fHp', wDA) > 0, true);
check('flame mass still 1',
  flameDistribution('armor', 150, wDA, { flameType: 'eternal' })
    .reduce((a, x) => a + x.prob, 0), 1, 1e-9);
// HP flames give 450/tier at lv150 against 8 stat/tier, so for a DA they dominate
// by ~30x even though flat STR is worth more per POINT than flat HP
check('flat STR is worth more per point than flat HP',
  wDA.flatByStat.STR > wDA.hpFlat, true);
check('  ... yet an HP flame tier beats a stat flame tier for a DA',
  flameTrackedSlots('armor', 150, wDA).find(s => s.label === 'HP').at(7)
  > flameTrackedSlots('armor', 150, wDA).find(s => s.label === 'STR').at(7), true);
check('HP% potential outranks STR% for a DA',
  cubeValue({ HP: 12 }, wDA) > cubeValue({ main_stats: 12 }, wDA), true);

// The same table with the Main Stat column selected. Identical labels, parses
// perfectly, and CORRECT as per-line values -- each is one point's worth times the
// amount beside it. It is just not a weight set until the amounts come back out.
const DA_TOTALS = 'Boss Damage\t\t1827.21\nAttack\t\t305.79\nAttack%\t\t2406.06\n'
  + 'Critical Dmg\t\t1121.69\nIgnore Dff(300)\t\t466.10\nIgnore Dff(380)\t\t594.50\n'
  + 'HP\t\t30.00\nHP%\t\t534.90\nNot Affected by % HP\t\t28.60\n'
  + 'STR\t\t54.75\nSTR%\t\t336.97\nNot Affected by % STR\t\t125.00\n'
  + 'All Stat%\t\t252.73';
// the same rows again as Final Damage: a different unit, the same weight set
const DA_FD = 'Boss Damage\t\t4.055%\nAttack\t\t0.679%\nAttack%\t\t5.339%\n'
  + 'Critical Dmg\t\t2.489%\nIgnore Dff(300)\t\t1.034%\nIgnore Dff(380)\t\t1.319%\n'
  + 'HP\t\t0.067%\nHP%\t\t1.187%\nNot Affected by % HP\t\t0.063%\n'
  + 'STR\t\t0.121%\nSTR%\t\t0.748%\nNot Affected by % STR\t\t0.277%\n'
  + 'All Stat%\t\t0.561%';

const wTot = buildWeights(parseScouter(DA_TOTALS));
check('the totals column still parses (labels are identical)',
  scouterUnknownRows(parseScouter(DA_TOTALS)).length, 0);
check('no row lands on 1', wTot.normalizedTo, null);
check('flagged as needing amounts', wTot.suspectTotals, true);
check('  ... and the profile line says so',
  weightsProfileText(wTot).indexOf('SCALE UNVERIFIED') >= 0, true);

// The per-line values are internally consistent -- 12% HP% against 9% all-stat
// really is 2.116, and that IS (12 x 44.57)/(9 x 28.08). Comparing that to the bare
// per-point ratio 1.587 and calling the gap a defect is an error about amounts, not
// a finding about the format. ~1e-3 because the column prints to two decimals.
check('the per-line column is internally consistent',
  wTot.hpPct / wTot.allStatPct,
  (12 * wDA.hpPct) / (9 * wDA.allStatPct), 1e-3);

// Left undivided it is counted twice over, by a DIFFERENT factor per row, which
// reorders rather than merely inflating -- the whole reason amounts exist.
check('undivided, a 12% HP line is valued 12x too high',
  cubeValue({ HP: 12 }, wTot) / cubeValue({ HP: 12 }, wDA), 12, 1e-2);
check('undivided, a 9% all-stat line is valued 9x too high',
  cubeValue({ all_stats: 9 }, wTot) / cubeValue({ all_stats: 9 }, wDA), 9, 1e-2);
// This particular pair keeps its order -- HP% leads either way. The danger is not
// that every comparison flips, it is that the error is invisible when none does.
check('  ... while this pair happens to keep its order',
  (cubeValue({ HP: 12 }, wTot) > cubeValue({ all_stats: 9 }, wTot))
  === (cubeValue({ HP: 12 }, wDA) > cubeValue({ all_stats: 9 }, wDA)), true);
check('  ... though their ratio is off by exactly the amount ratio',
  (cubeValue({ HP: 12 }, wTot) / cubeValue({ all_stats: 9 }, wTot))
  / (cubeValue({ HP: 12 }, wDA) / cubeValue({ all_stats: 9 }, wDA)), 12 / 9, 1e-2);

/* ---------- amounts divide the per-line column back to per-point ---------- */
// MapleScouter's own defaults, which is what "MapleScouter defaults" fills in.
const AMT = {
  boss: 40, attFlat: 30, attPctPhys: 12, critDmg: 8, ied300: 40, ied380: 40,
  hpFlat: 30, hpPct: 12, 'nopct.HP': 200,
  'flat.STR': 30, 'pct.STR': 12, 'nopct.STR': 200, allStatPct: 9,
};
const wDiv = buildWeights(parseScouter(DA_TOTALS), { amounts: AMT });
check('the defaults table matches MapleScouter’s page',
  Object.keys(AMT).every(k => SCOUTER_DEFAULT_AMOUNTS[k] === AMT[k]), true);
// The round trip: dividing the defaults out reproduces the per-point block exactly.
// One check over every field rather than one per field -- a failure here means the
// round trip broke, and which field it was is two lines away in the output.
check('dividing the defaults out reproduces every per-point weight',
  ['boss', 'attFlat', 'attPct', 'critDmg', 'ied', 'hpPct', 'mainPct', 'allStatPct']
    .concat(['STR'])
    .every(k => Math.abs((k === 'STR' ? wDiv.flatByStat.STR : wDiv[k])
                       - (k === 'STR' ? wDA.flatByStat.STR : wDA[k])) <= 5e-3), true);
// HP 30/30 lands back on exactly 1, so the normaliser reappears...
check('flat HP returns to the unit', wDiv.hpFlat, 1, 1e-6);
check('the normaliser is found again', wDiv.normalizedTo, 'HP');
check('  ... so the warning clears itself', wDiv.suspectTotals, false);
check('and the ranking now agrees with the per-point paste',
  cubeValue({ HP: 12 }, wDiv) / cubeValue({ all_stats: 9 }, wDiv),
  cubeValue({ HP: 12 }, wDA) / cubeValue({ all_stats: 9 }, wDA), 1e-3);
check('still read as a DA', weightsProfileText(wDiv).indexOf('Demon Avenger') >= 0, true);
check('the divisions are reported', weightsProfileText(wDiv).indexOf('divided by') >= 0, true);

// Final Damage is the same weight set in another unit, so once divided every RATIO
// must agree with Main Stat even though no absolute value does.
const wFd = buildWeights(parseScouter(DA_FD), { amounts: AMT });
check('Final Damage column detected', wFd.unit, '%fd');
check('Main Stat column detected', wDiv.unit, 'stat');
check('Final Damage normalises nothing, so it is never flagged',
  wFd.suspectTotals, false);
for (const [name, num, den] of [
  ['HP% / STR%',      w => w.hpPct,      w => w.mainPct],
  ['all% / STR%',     w => w.allStatPct, w => w.mainPct],
  ['boss / att%',     w => w.boss,       w => w.attPct],
  ['flat STR / HP%',  w => w.flatByStat.STR, w => w.hpPct],
]) {
  check(`same weight set either column: ${name}`,
    num(wFd) / den(wFd), num(wDiv) / den(wDiv), 3e-3);
}

/* ---------- a three-column paste carries its own amounts ---------- */
const THREE = 'Boss Damage\t40\t1827.21\nHP\t30\t30.00\nHP%\t12\t534.90\n'
  + 'STR\t30\t54.75\nSTR%\t12\t336.97\nAll Stat%\t9\t252.73';
const pThree = parseScouter(THREE);
const wThree = buildWeights(pThree);
check('the amount column is read when present', pThree.amounts['hpPct'], 12);
check('every row still recognised', scouterUnknownRows(pThree).length, 0);
check('divided without any UI input', wThree.hpPct, wDA.hpPct, 5e-3);
check('flagged as coming from the paste', wThree.amountsFromPaste, true);
check('a paste amount beats the UI',
  buildWeights(pThree, { amounts: { hpPct: 999 } }).hpPct, wDA.hpPct, 5e-3);
// a label ending in a number must not have its last word eaten as an amount
check('two-column rows are unaffected', buildWeights(parseScouter(
  'Ignore Dff(300)\t\t466.10')).ied, 466.10, 1e-9);
check('an unknown label falls back to two-column',
  parseScouter('Some Thing 2\t\t5.5').rows[0].amount, null);

check('a real paste is never flagged', wDA.suspectTotals, false);
check('  ... nor a mage one', buildWeights(parseScouter(SCOUTER_EXAMPLE)).suspectTotals, false);
check('  ... which normalises against its main stat',
  buildWeights(parseScouter(SCOUTER_EXAMPLE)).normalizedTo, 'INT');
// a trailing % is tolerated so a stray format cannot blank the whole tool
check('a % suffix does not break parsing',
  buildWeights(parseScouter('STR\t\t1%\nSTR%\t\t12%')).mainPct, 12, 1e-9);
check('  ... and is not read into the number',
  buildWeights(parseScouter('STR\t\t1%\nSTR%\t\t12%')).flatByStat.STR, 1, 1e-9);

section('class profiles (flames)');
// Synthetic pastes shaped like MapleScouter output for the three special cases.
const XENON_PASTE = 'Boss Damage\t\t3.5\nAttack\t\t1.2\nAttack%\t\t15.2\n'
  + 'Critical Dmg\t\t11.9\nIgnore Dff(300)\t\t1.2\nSTR\t\t1\nSTR%\t\t4.4\n'
  + 'DEX\t\t0.98\nDEX%\t\t4.3\nLUK\t\t0.97\nLUK%\t\t4.2\nAll Stat%\t\t13.1';
const SHAD_PASTE = 'Boss Damage\t\t12.1\nAttack\t\t2.8\nAttack%\t\t50.1\n'
  + 'LUK\t\t1\nLUK%\t\t11.9\nDEX\t\t0.26\nDEX%\t\t0.9\nSTR\t\t0.24\n'
  + 'STR%\t\t0.8\nAll Stat%\t\t13.5';
const DA_PASTE = 'Boss Damage\t\t10.2\nAttack\t\t2.1\nAttack%\t\t38.4\n'
  + 'HP\t\t1\nHP%\t\t14.9\nSTR\t\t0.2\nSTR%\t\t0.7\nAll Stat%\t\t1.1\n'
  + 'Critical Dmg\t\t30.2';
const wX = buildWeights(parseScouter(XENON_PASTE));
const wS = buildWeights(parseScouter(SHAD_PASTE));
const wD = buildWeights(parseScouter(DA_PASTE));

// MathBro's flame calculator needs a class dropdown because it asks for hand-typed
// equivalences; its choose_from constants are the junk-slot counts per class.
// Ours must land on the same numbers purely from the weights.
check('mage junk = 10 (MathBro choose_from)',
  FLAME_SLOTS_ARMOR - flameTrackedSlots('armor', 160, w).length, 10);
check('xenon junk = 8', FLAME_SLOTS_ARMOR - flameTrackedSlots('armor', 160, wX).length, 8);
check('shadower/db junk = 8', FLAME_SLOTS_ARMOR - flameTrackedSlots('armor', 160, wS).length, 8);
// worker.js:755 counts xenon pairs among its three stats double; ours does it via
// flat[a]+flat[b], no special case
check('xenon STR+DEX pair counts both stats',
  flameTrackedSlots('armor', 160, wX).find(x => x.label === 'STR+DEX').at(1),
  5 * (1 + 0.98), 1e-9);
check('a Demon Avenger tracks a flat-HP slot',
  flameTrackedSlots('armor', 150, wD).some(x => x.label === 'HP'), true);
check('  ... 450 HP per tier at lv150',
  flameTrackedSlots('armor', 150, wD).find(x => x.label === 'HP').at(7), 3150, 1e-9);
check('a mage does not track HP',
  flameTrackedSlots('armor', 150, w).some(x => x.label === 'HP'), false);
check('fHp weight is the paste HP weight', flameInputWeight('fHp', wD), 1, 1e-9);
check('fHp is dead for a mage', flameInputWeight('fHp', w), 0, 1e-12);
check('DA flame mass is still 1',
  flameDistribution('armor', 150, wD, { flameType: 'eternal' })
    .reduce((a, x) => a + x.prob, 0), 1, 1e-9);
check('a pure-HP paste is not treated as empty', wD.empty, false);
// the defect that motivated per-stat columns: Sec multiplied one number by the
// SUM of non-main weights, only right with exactly one secondary. Per-stat
// entry is exact for a three-stat flame.
check('xenon flame valued per stat, not through a Sec mush',
  flameCurrentValue({ fSTR: 40, fDEX: 38, fLUK: 42 }, wX),
  40 * 1 + 38 * 0.98 + 42 * 0.97, 1e-9);
check('xenon per-stat input weights', flameInputWeight('fDEX', wX), 0.98, 1e-9);
check('DA HP input carries weight 1', flameInputWeight('fHp', wD), 1, 1e-9);
check('shadower sees all three of its stats',
  ['fSTR', 'fDEX', 'fLUK'].every(k => flameInputWeight(k, wS) > 0), true);

section('class profiles (potentials)');
check('mage stays collapsed', cubeStatCollapsed(w), true);
check('shadower stays collapsed', cubeStatCollapsed(wS), true);
check('xenon does not collapse', cubeStatCollapsed(wX), false);
check('xenon all-stat keeps its true weight',
  cubeValue({ all_stats: 9 }, wX), 9 * 13.1, 1e-9);
check('  ... and beats a single 12% line',
  cubeValue({ all_stats: 9 }, wX) > cubeValue({ main_stats: 12 }, wX), true);
check('xenon sub lines qualify', cubeSubStats(wX).join(','), 'DEX,LUK');
check('mage subs stay folded (LUK% is 13% of INT%)', cubeSubStats(w).length, 0);
check('shadower subs stay folded (tiny bases)', cubeSubStats(wS).length, 0);
check('xenon DEX% line carries its own weight',
  cubeValue({ 'DEX%': 12 }, wX), 12 * 4.3, 1e-9);
check('sub lines get the 160+ bump', cubeLineValue('DEX%', 12, 160), 13);
for (const ct of ['black', 'red']) {
  check(`hat/${ct} combos sum to 1 with subs injected`,
    cubeCombos(ct, 'hat', 160, cubeSubStats(wX)).reduce((a, c) => a + c.prob, 0), 1, 1e-12);
}
check('a DEX% line reaches the enumeration',
  cubeCombos('black', 'hat', 160, cubeSubStats(wX)).some(c => c.sums['DEX%']), true);
check('DA HP% dominates its potentials',
  cubeValue({ HP: 12 }, wD) > cubeValue({ main_stats: 12 }, wD), true);
check('xenon example text keeps the currencies apart',
  cubeExampleText({ main_stats: 12, all_stats: 9, 'DEX%': 13 }, wX),
  'stat 12, all 9, DEX% 13');
check('mage example text still merges', cubeExampleText({ main_stats: 20, all_stats: 10 }, w),
  'stat 30');

section('flames.js constants (from worker.js, not main_IRbm.js)');
for (const t in FLAME_TIER_PROBS) {
  const s = Object.values(FLAME_TIER_PROBS[t]).reduce((a, b) => a + b, 0);
  check(`${t} tier probabilities sum to 1`, s, 1, 1e-9);
}
// worker.js has 4:0.01 / 7:0.02 here; main_IRbm.js has 4:0 / 7:0.03. worker.js is
// the file that actually computes, so it is the one vendored.
check('reincarnation uses the worker.js values',
  FLAME_TIER_PROBS.reincarnation[4] === 0.01 && FLAME_TIER_PROBS.reincarnation[7] === 0.02, true);
check('non-advantaged line counts sum to 1',
  Object.values(FLAME_LINES_NON_ADV).reduce((a, b) => a + b, 0), 1, 1e-9);
check('advantaged eternal starts at tier 4', FLAME_TIER_PROBS.eternal[3], 0);
check('non-advantaged shifts tiers down 2',
  Object.keys(flameTierProbs('eternal', true)).map(Number).sort((a,b)=>a-b).join(','),
  '1,2,3,4,5');

section('flames.js distribution');
// The mass check is load-bearing: an earlier version emitted at interior nodes of
// the subset walk as well as leaves, which double-counted partial subsets and made
// this read 3.90 instead of 1.
for (const [kind, lvl, ft, na] of [['armor',160,'eternal',false],
                                   ['armor',160,'eternal',true],
                                   ['armor',150,'powerful',false],
                                   ['weapon',200,'eternal',false],
                                   ['weapon',250,'reincarnation',false]]) {
  const d = flameDistribution(kind, lvl, w,
    { flameType: ft, nonAdvantaged: na, baseAtt: 253 });
  const m = d.reduce((a, x) => a + x.prob, 0);
  check(`${kind} lv${lvl} ${ft}${na ? ' non-adv' : ''} mass = 1`, m, 1, 1e-9);
}
check('tracked slots for a mage armor = 9',
  flameTrackedSlots('armor', 160, w).length, 9);
check('  ... leaving 10 junk, matching MathBro’s choose_from',
  FLAME_SLOTS_ARMOR - flameTrackedSlots('armor', 160, w).length, 10);
// A weapon adds boss% and damage% to the same 9, giving 11 of 21. It was 10 while
// damage carried no weight; now that damage% is the boss weight, that slot counts.
check('weapon adds boss and damage, so 11 tracked',
  flameTrackedSlots('weapon', 200, w, { baseAtt: 253 }).length, 11);
check('  ... leaving 10 junk of 21',
  FLAME_SLOTS_WEAPON - flameTrackedSlots('weapon', 200, w, { baseAtt: 253 }).length, 10);
check('the damage slot is what changed',
  flameTrackedSlots('weapon', 200, w, { baseAtt: 253 }).some(s => s.label === 'damage'), true);

const dA = flameDistribution('armor', 160, w, { flameType: 'eternal' });
const dN = flameDistribution('armor', 160, w, { flameType: 'eternal', nonAdvantaged: true });
const rA = flameReroll(dA, 0), rN = flameReroll(dN, 0);
check('advantage raises the expected score', rA.expected > rN.expected, true);
check('advantage raises the ceiling', rA.max > rN.max, true);
check('lv160 beats lv150',
  flameReroll(flameDistribution('armor', 160, w, { flameType: 'eternal' }), 0).expected >
  flameReroll(flameDistribution('armor', 150, w, { flameType: 'eternal' }), 0).expected, true);
check('reincarnation beats eternal',
  flameReroll(flameDistribution('armor', 160, w, { flameType: 'reincarnation' }), 0).expected >
  rA.expected, true);

section('flames.js reroll value');
check('gain from nothing equals expected score', flameReroll(dA, 0).gainPerRoll,
  rA.expected, 1e-9);
check('nothing beats the ceiling', flameReroll(dA, rA.max).pImprove, 0, 1e-12);
check('rolls to beat the ceiling is never',
  flameReroll(dA, rA.max).rollsToBeat, Infinity);
check('P(better) falls as current rises',
  flameReroll(dA, 60).pImprove < flameReroll(dA, 20).pImprove, true);
check('gain falls as current rises',
  flameReroll(dA, 60).gainPerRoll < flameReroll(dA, 20).gainPerRoll, true);
check('rolls to beat = 1 / P(better)',
  flameReroll(dA, 60).rollsToBeat, 1 / flameReroll(dA, 60).pImprove, 1e-9);
check('E[value | better] exceeds current',
  flameReroll(dA, 60).expectedIfBetter > 60, true);
check('weapon attack scales with base attack',
  flameReroll(flameDistribution('weapon', 200, w, { flameType: 'eternal', baseAtt: 300 }), 0).max >
  flameReroll(flameDistribution('weapon', 200, w, { flameType: 'eternal', baseAtt: 253 }), 0).max, true);
check('flameable set excludes rings for now', FLAMEABLE.has('ring1'), false);
check('flameable set includes weapon', FLAMEABLE.has('weapon'), true);

/* ---------- percentiles ---------- */
section('percentile machinery');
check('normalQuantile(0.5) = 0', normalQuantile(0.5), 0, 1e-6);
check('normalQuantile(0.975) ~ 1.96', normalQuantile(0.975), 1.96, 5e-3);
check('normalQuantile is symmetric',
  normalQuantile(0.85) + normalQuantile(0.15), 0, 1e-9);
check('zero variance collapses to the mean', lognormalPct(1e9, 0, 85), 1e9, 1e-9);
check('p50 of a lognormal is below its mean', lognormalPct(1e9, 1e18, 50) < 1e9, true);
check('percentiles increase monotonically',
  lognormalPct(1e9, 1e18, 50) < lognormalPct(1e9, 1e18, 85)
    && lognormalPct(1e9, 1e18, 85) < lognormalPct(1e9, 1e18, 95), true);

// cube and flame counts are geometric, so their percentile is exact
check('certain success needs one attempt', geometricPct(1, 85), 1);
check('impossible never succeeds', geometricPct(0, 85), Infinity);
check('p=0.5 median is 1 roll', geometricPct(0.5, 50), 1);
check('p=0.01 p95 is 299', geometricPct(0.01, 95), 299);
check('geometric p50 is below the mean 1/p', geometricPct(0.1, 50) < 10, true);
check('geometric p95 is above the mean 1/p', geometricPct(0.1, 95) > 10, true);

section('percentile applied to a climb');
const rc = sfClimb(150, 21, 22, CFG);
check('climb reports a variance', rc.variance > 0, true);
check('no percentile gives the mean', sfClimbAtPct(rc, 0), rc.cost, 1e-9);
check('p50 is below the mean', sfClimbAtPct(rc, 50) < rc.cost, true);
check('p95 is above the mean', sfClimbAtPct(rc, 95) > rc.cost, true);
check('a percentile on a priced climb is finite',
  isFinite(sfClimbAtPct(sfClimb(150, 22, 23, CFG), 85)), true);
check('  ... and above the mean',
  sfClimbAtPct(sfClimb(150, 22, 23, CFG), 85) > sfClimb(150, 22, 23, CFG).cost, true);
check('sub-15 has variance too', sfClimb(150, 0, 15, CFG).variance > 0, true);

const ct = cubeTargetScanAll('emblem', w, cubeCurrentValue([['ATT', 9]], w), 1)[0];
check('no percentile gives the mean cube count', cubeAtPct(ct, 0).cubes, ct.cubes, 1e-9);
check('cube p95 exceeds the mean', cubeAtPct(ct, 95).cubes > ct.cubes, true);
check('cube percentile cost = cubes x cost per cube',
  cubeAtPct(ct, 85).cost, cubeAtPct(ct, 85).cubes * ct.costPerCube, 1e-6);
check('cost per cube includes the reveal fee',
  ct.costPerCube, CUBE_COST[ct.cubeType] + cubeRevealCost(0), 1e-9);

/* ---------- numbers to eyeball against lostara ---------- */
section('compare these against lostara by hand (ssf, star catch, mvp none)');
const fm = n => !isFinite(n) ? '—'
  : n >= 1e12 ? (n/1e12).toFixed(2)+'t' : n >= 1e9 ? (n/1e9).toFixed(2)+'b'
  : n >= 1e6 ? (n/1e6).toFixed(1)+'m' : Math.round(n).toLocaleString();
for (const [L, a, b] of [[150,0,15],[150,15,16],[150,17,18],[150,21,22],
                         [150,17,22],[160,17,22],[200,21,22],[150,22,23]]) {
  const r = sfClimb(L, a, b, CFG);
  info(`lv${L}  ${a}★ → ${b}★`,
    `${fm(r.cost)}   booms ${r.booms.toFixed(2)}   `
    + (r.modes && r.modes.length ? r.modes.map(m => `${m.star}★:m${m.mode}`).join(' ') : '—'));
}

/* ---------- render ---------- */
const out = document.getElementById('out');
let lastGroup = null;
const frag = document.createDocumentFragment();
let table = null;
for (const r of results) {
  if (r.group !== lastGroup) {
    const h = document.createElement('h2');
    h.textContent = r.group;
    frag.append(h);
    table = document.createElement('table');
    frag.append(table);
    lastGroup = r.group;
  }
  const tr = table.insertRow();
  if (r.info) {
    tr.insertCell().textContent = r.name;
    const c = tr.insertCell();
    c.colSpan = 3; c.className = 'dim'; c.textContent = r.got;
  } else {
    tr.insertCell().textContent = r.name;
    const st = tr.insertCell();
    st.className = r.ok ? 'pass' : 'fail';
    st.textContent = r.ok ? 'pass' : 'FAIL';
    const g = tr.insertCell(); g.className = 'num'; g.textContent = r.got;
    const wc = tr.insertCell(); wc.className = 'num dim';
    wc.textContent = r.ok ? '' : 'want ' + r.want;
  }
}
out.append(frag);

const total = results.filter(r => !r.info).length;
const failed = results.filter(r => !r.info && !r.ok);
const s = document.getElementById('summary');
s.className = failed.length ? 'bad' : 'ok';
s.textContent = failed.length
  ? `${failed.length} of ${total} checks FAILED: ` + failed.map(f => f.name).join('; ')
  : `all ${total} checks passed`;
</script>
</body>
</html>
